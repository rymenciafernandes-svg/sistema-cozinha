  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;
    
    const SUPABASE_URL = 'https://ddngvelrtqmfgaeqsjem.supabase.co';

    // ==========================================
    // COMPONENTE: LIVE CURSOR (SUPORTE AO VIVO)
    // ==========================================
    function LiveCursor({ companyId, currentUsername, currentUserRole, targetUsername, isActive, supabaseClient }) {
      const [remoteCursor, setRemoteCursor] = useState(null);
      const [isRemoteOnline, setIsRemoteOnline] = useState(false);
      const [clickRipples, setClickRipples] = useState([]);
      const lastEmitRef = useRef(0);
      const lastScrollEmitRef = useRef(0);
      const timeoutRef = useRef(null);
      const isReceivingScrollRef = useRef(false);
      const scrollAnimationRef = useRef(null);
      const scrollTargetRef = useRef(null);
      const scrollPositionRef = useRef(0);
      const scrollLastReceivedRef = useRef(0);

      useEffect(() => {
        if (!isActive || !companyId || !targetUsername || !supabaseClient) {
          setRemoteCursor(null);
          return;
        }

        const channel = supabaseClient.channel(`cursor-${companyId}-${targetUsername}`, {
          config: { broadcast: { self: false } }
        });

        channel
          .on('broadcast', { event: 'cursor-pos' }, ({ payload }) => {
            if (payload && payload.sender !== currentUsername) {
              setRemoteCursor({ xRatio: payload.xRatio, yRatio: payload.yRatio, sender: payload.sender, role: payload.role });
              setIsRemoteOnline(true);
              if (timeoutRef.current) clearTimeout(timeoutRef.current);
              timeoutRef.current = setTimeout(() => setIsRemoteOnline(false), 4000);
            }
          })
          .on('broadcast', { event: 'cursor-click' }, ({ payload }) => {
            if (payload && payload.sender !== currentUsername) {
              const posX = payload.xRatio * window.innerWidth;
              const posY = payload.yRatio * window.innerHeight;
              const rippleId = Date.now();
              setClickRipples(prev => [...prev, { id: rippleId, x: posX, y: posY }]);
              setTimeout(() => setClickRipples(prev => prev.filter(r => r.id !== rippleId)), 800);

              // Segurança: cliques remotos são apenas indicadores visuais.
              // Nunca acionar botões ou inputs a partir de broadcasts de cursor.
            }
          })
          .on('broadcast', { event: 'page-scroll' }, ({ payload }) => {
            // Somente o Master guia a rolagem; o restaurante acompanha.
            if (!payload || payload.sender === currentUsername || currentUserRole === 'superadmin') return;
            const ratio = Number(payload.scrollRatio);
            if (!Number.isFinite(ratio)) return;
            const main = document.querySelector('[data-fs-main-scroll]');
            const mainScrollable = main && main.scrollHeight > main.clientHeight + 2;
            const target = mainScrollable ? main : (document.scrollingElement || document.documentElement);
            const maxScroll = Math.max(0, target.scrollHeight - target.clientHeight);
            scrollPositionRef.current = Math.min(1, Math.max(0, ratio)) * maxScroll;
            scrollLastReceivedRef.current = performance.now();
            if (scrollTargetRef.current !== target) {
              if (scrollAnimationRef.current !== null) cancelAnimationFrame(scrollAnimationRef.current);
              scrollAnimationRef.current = null;
              scrollTargetRef.current = target;
            }
            if (scrollAnimationRef.current !== null) return;
            isReceivingScrollRef.current = true;
            const animate = () => {
              const el = scrollTargetRef.current;
              if (!el) { scrollAnimationRef.current = null; return; }
              const delta = scrollPositionRef.current - el.scrollTop;
              if (Math.abs(delta) < 0.7) {
                el.scrollTop = scrollPositionRef.current;
                scrollAnimationRef.current = null;
                // A animação termina quando param de chegar posições.
                if (performance.now() - scrollLastReceivedRef.current > 130) isReceivingScrollRef.current = false;
                return;
              }
              el.scrollTop += delta * 0.32;
              scrollAnimationRef.current = requestAnimationFrame(animate);
            };
            scrollAnimationRef.current = requestAnimationFrame(animate);
          })
          .subscribe();

        const handleMouseMove = (e) => {
          const now = Date.now();
          if (now - lastEmitRef.current > 40) {
            lastEmitRef.current = now;
            channel.send({
              type: 'broadcast',
              event: 'cursor-pos',
              payload: { xRatio: e.clientX / window.innerWidth, yRatio: e.clientY / window.innerHeight, sender: currentUsername, role: currentUserRole || 'operador' }
            });
          }
        };

        const handleClick = (e) => {
          channel.send({
            type: 'broadcast',
            event: 'cursor-click',
            payload: { xRatio: e.clientX / window.innerWidth, yRatio: e.clientY / window.innerHeight, sender: currentUsername }
          });
        };

        const handleScroll = (event) => {
          // Não retransmitir rolagem do restaurante, evitando eco e disputa.
          if (currentUserRole !== 'superadmin' || isReceivingScrollRef.current) return;
          const main = document.querySelector('[data-fs-main-scroll]');
          const source = event.target;
          const docScroll = source === document || source === document.documentElement || source === document.body;
          if (!docScroll && source !== main) return; // Ignora chat, menus e modais.
          const now = performance.now();
          if (now - lastScrollEmitRef.current < 33) return;
          lastScrollEmitRef.current = now;
          const el = source === main ? main : (document.scrollingElement || document.documentElement);
          const maxScroll = Math.max(0, el.scrollHeight - el.clientHeight);
          channel.send({
            type: 'broadcast',
            event: 'page-scroll',
            payload: { scrollRatio: maxScroll > 0 ? el.scrollTop / maxScroll : 0, sender: currentUsername }
          });
        };

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('click', handleClick);
        document.addEventListener('scroll', handleScroll, { passive: true, capture: true });

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('click', handleClick);
          document.removeEventListener('scroll', handleScroll, true);
          if (scrollAnimationRef.current !== null) cancelAnimationFrame(scrollAnimationRef.current);
          if (timeoutRef.current) clearTimeout(timeoutRef.current);
          supabaseClient.removeChannel(channel);
        };
      }, [isActive, companyId, targetUsername, currentUsername, currentUserRole, supabaseClient]);

      if (!isActive || !remoteCursor || !isRemoteOnline) return null;

      const posX = remoteCursor.xRatio * (typeof window !== 'undefined' ? window.innerWidth : 1000);
      const posY = remoteCursor.yRatio * (typeof window !== 'undefined' ? window.innerHeight : 800);
      const isSuper = remoteCursor.role === 'superadmin' || remoteCursor.sender === 'admin';

      return (
        <div className="fixed inset-0 pointer-events-none z-[9999] overflow-hidden">
          {clickRipples.map(ripple => (
            <span key={ripple.id} style={{ left: ripple.x - 18, top: ripple.y - 18 }} className="absolute w-9 h-9 rounded-full border-2 border-[#D95B1E] animate-ping opacity-90 pointer-events-none" />
          ))}
          <div style={{ transform: `translate3d(${posX}px, ${posY}px, 0)`, transition: 'transform 0.07s linear' }} className="absolute top-0 left-0 flex flex-col items-start select-none">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" className="drop-shadow-[0_2px_8px_rgba(0,0,0,0.8)] -translate-x-1 -translate-y-1">
              <path d="M5.65 2.15C5.1 1.6 4.25 2.05 4.3 2.85L5.75 19.35C5.8 20.05 6.7 20.35 7.2 19.85L11.5 15.5L16.2 21.8C16.5 22.2 17.1 22.3 17.5 22L20.2 20C20.6 19.7 20.7 19.1 20.4 18.7L15.7 12.4L21.4 11.2C22.1 11.05 22.3 10.15 21.75 9.75L5.65 2.15Z" fill={isSuper ? '#D95B1E' : '#10B981'} stroke="#000000" strokeWidth="1.5" />
            </svg>
            <div className={`ml-3 -mt-1 px-2 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider text-white shadow-xl flex items-center gap-1.5 border border-black/30 ${isSuper ? 'bg-[#D95B1E]' : 'bg-emerald-600'}`}>
              <span className="w-1.5 h-1.5 rounded-full bg-white animate-ping" />
              <span>{isSuper ? `Suporte (${remoteCursor.sender})` : remoteCursor.sender}</span>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // COMPONENTE: SUPPORT CHAT (CHAT EM TEMPO REAL)
    // ==========================================
    function SupportChat({ companyId, currentUsername, currentUserRole, operatorUsername, isVisible, supabaseClient }) {
      const [isOpen, setIsOpen] = useState(false);
      const [messages, setMessages] = useState([]);
      const [newMessage, setNewMessage] = useState('');
      const [unreadCount, setUnreadCount] = useState(0);
      const [chatError, setChatError] = useState('');
      const messagesEndRef = useRef(null);

      const fetchMessages = async () => {
        if (!companyId || !operatorUsername || !supabaseClient) return;
        try {
          const { data, error } = await supabaseClient
            .from('support_messages')
            .select('*')
            .eq('company_id', companyId)
            .eq('operator_username', operatorUsername)
            .order('created_at', { ascending: true });
          if (error) throw error;
          if (data) setMessages(data);
          setChatError('');
        } catch (err) { setChatError('Falha ao receber mensagens: ' + (err.message || 'erro desconhecido')); }
      };

      useEffect(() => {
        if (!isVisible || !companyId || !operatorUsername || !supabaseClient) return;
        fetchMessages();
        // Recupera mensagens mesmo quando o Realtime não entrega eventos por RLS.
        const polling = setInterval(fetchMessages, 2500);

        const channel = supabaseClient.channel(`chat-${companyId}-${operatorUsername}`)
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'support_messages', filter: `operator_username=eq.${operatorUsername}` }, (payload) => {
            if (payload.new && payload.new.company_id === companyId) {
              setMessages(prev => [...prev, payload.new]);
              if (!isOpen && payload.new.sender_username !== currentUsername) setUnreadCount(c => c + 1);
            }
          }).subscribe();

        return () => { clearInterval(polling); supabaseClient.removeChannel(channel); };
      }, [companyId, operatorUsername, isOpen, currentUsername, isVisible, supabaseClient]);

      useEffect(() => {
        if (isOpen) messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, isOpen]);

      if (!isVisible || !companyId || !operatorUsername) return null;

      const handleSendMessage = async (e) => {
        e.preventDefault();
        const text = newMessage.trim();
        if (!text) return;
        setChatError('');
        try {
          const { error } = await supabaseClient.from('support_messages').insert([{
            company_id: companyId,
            operator_username: operatorUsername,
            sender_username: currentUsername,
            sender_role: currentUserRole || 'operador',
            message: text
          }]);
          if (error) throw error;
          setNewMessage('');
          await fetchMessages();
        } catch (err) { setChatError('Mensagem não enviada: ' + (err.message || 'erro desconhecido')); }
      };

      return (
        <div className="fixed bottom-5 right-5 z-50 flex flex-col items-end">
          {isOpen && (
            <div className="w-80 sm:w-96 h-[480px] bg-[#161616] border border-[#2d2d2d] rounded-2xl shadow-2xl flex flex-col overflow-hidden mb-3">
              <div className="p-4 bg-[#111111] border-b border-[#262626] flex items-center justify-between">
                <div className="flex items-center gap-2.5">
                  <div className="w-8 h-8 rounded-full bg-[#D95B1E]/10 border border-[#D95B1E]/30 flex items-center justify-center text-[#D95B1E]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg>
                  </div>
                  <div>
                    <h4 className="text-xs font-bold text-white flex items-center gap-1.5">
                      Canal Direto de Suporte
                      <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                    </h4>
                    <p className="text-[10px] text-zinc-400">Atendimento: <strong className="text-[#D95B1E]">{operatorUsername}</strong></p>
                  </div>
                </div>
                <button onClick={() => setIsOpen(false)} className="text-zinc-400 hover:text-white p-1 rounded-lg">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
              </div>

              <div className="flex-1 p-4 overflow-y-auto space-y-3 text-xs">
                {messages.length === 0 ? (
                  <div className="h-full flex flex-col items-center justify-center text-center text-zinc-500 space-y-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="text-zinc-700"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    <p className="text-[11px]">Nenhuma mensagem ainda.<br />Inicie a conversa pelo suporte.</p>
                  </div>
                ) : (
                  messages.map(m => {
                    const isMe = m.sender_username?.toLowerCase() === currentUsername?.toLowerCase();
                    return (
                      <div key={m.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                        <span className="text-[10px] text-zinc-500 mb-0.5 px-1">{isMe ? 'Você' : m.sender_username} ({m.sender_role})</span>
                        <div className={`max-w-[85%] px-3 py-2 rounded-xl text-xs leading-relaxed ${isMe ? 'bg-[#D95B1E] text-white font-medium rounded-tr-none' : 'bg-[#222222] text-white rounded-tl-none border border-[#333]'}`}>
                          {m.message}
                        </div>
                        <span className="text-[9px] text-zinc-600 mt-0.5 px-1 font-mono">{new Date(m.created_at).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</span>
                      </div>
                    );
                  })
                )}
                <div ref={messagesEndRef} />
              </div>

              {chatError && <p role="alert" className="px-3 py-2 text-xs text-red-300 bg-red-950/40">{chatError}</p>}
              <form onSubmit={handleSendMessage} className="p-3 bg-[#111111] border-t border-[#262626] flex items-center gap-2">
                <input type="text" placeholder="Digite sua mensagem..." value={newMessage} onChange={e => setNewMessage(e.target.value)} className="flex-1 bg-[#1c1c1c] border border-[#333] rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-[#D95B1E] transition-colors placeholder:text-zinc-500" />
                <button type="submit" className="bg-[#D95B1E] hover:bg-[#c34e17] text-white p-2 rounded-xl transition-all shadow-md disabled:opacity-40" disabled={!newMessage.trim()}>
                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                </button>
              </form>
            </div>
          )}

          <button onClick={() => { if (!isOpen) setUnreadCount(0); setIsOpen(!isOpen); }} className="w-14 h-14 rounded-full bg-[#D95B1E] hover:bg-[#c34e17] text-white shadow-2xl flex items-center justify-center transition-transform hover:scale-105 active:scale-95 relative border-2 border-orange-400/30 cursor-pointer" title="Abrir Chat de Suporte">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            {unreadCount > 0 && <span className="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-black">{unreadCount}</span>}
          </button>
        </div>
      );
    }

    // Editor de enquadramento: exporta somente a área visível do banner.
    function CoverCropEditor({ imageSrc, onApply, onCancel }) {
      const canvasRef = useRef(null);
      const imageRef = useRef(null);
      const dragRef = useRef(null);
      const [ready, setReady] = useState(false);
      const [zoom, setZoom] = useState(1);
      const [position, setPosition] = useState({ x: 50, y: 50 });
      const [loadError, setLoadError] = useState(false);
      const WIDTH = 1200, HEIGHT = 360;

      useEffect(() => {
        setReady(false);
        setLoadError(false);
        const image = new Image();
        image.onload = () => { imageRef.current = image; setReady(true); };
        image.onerror = () => setLoadError(true);
        image.src = imageSrc;
      }, [imageSrc]);

      function cropGeometry(img, z) {
        const ratio = WIDTH / HEIGHT;
        const baseW = Math.min(img.width, img.height * ratio);
        const baseH = baseW / ratio;
        return { cropW: baseW / z, cropH: baseH / z };
      }

      useEffect(() => {
        if (!ready || !canvasRef.current || !imageRef.current) return;
        const img = imageRef.current;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const { cropW, cropH } = cropGeometry(img, zoom);
        const left = (img.width - cropW) * position.x / 100;
        const top = (img.height - cropH) * position.y / 100;
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        ctx.drawImage(img, left, top, cropW, cropH, 0, 0, WIDTH, HEIGHT);
      }, [ready, zoom, position]);

      function startDrag(e) {
        if (!ready) return;
        e.preventDefault();
        e.currentTarget.setPointerCapture(e.pointerId);
        dragRef.current = { x: e.clientX, y: e.clientY, position };
      }
      function moveDrag(e) {
        if (!dragRef.current || !imageRef.current) return;
        const rect = canvasRef.current.getBoundingClientRect();
        const { cropW, cropH } = cropGeometry(imageRef.current, zoom);
        const maxX = imageRef.current.width - cropW;
        const maxY = imageRef.current.height - cropH;
        const dx = (e.clientX - dragRef.current.x) * cropW / rect.width;
        const dy = (e.clientY - dragRef.current.y) * cropH / rect.height;
        const clamp = v => Math.max(0, Math.min(100, v));
        setPosition({
          x: maxX > 0.01 ? clamp(dragRef.current.position.x - dx / maxX * 100) : 50,
          y: maxY > 0.01 ? clamp(dragRef.current.position.y - dy / maxY * 100) : 50
        });
      }
      function applyCrop() {
        if (!ready || !canvasRef.current) return;
        onApply(canvasRef.current.toDataURL('image/jpeg', 0.82));
      }
      return (

      const units = {un:'un',g:'g',kg:'kg',ml:'ml',l:'l'};
      const number = (value) => Number(String(value).replace(',','.'));

      const load = React.useCallback(async () => {
        if (!companyId || companyId === 'foodstrick-master') return;
        setLoading(true); setError('');
        try {
          const [a,b,c,d] = await Promise.all([

          setStockAddons(results[0].data||[]);setStockRemovals(results[1].data||[]);
          setAddonLinks(results[2].data||[]);setRemovalLinks(results[3].data||[]);
          setStockOrders(results[4].data||[]);setStockExtraAvailable(true);
        } catch(e) {setStockExtraAvailable(false);setStockExtraError('Não foi possível consultar as configurações de estoque: '+(e.message||'erro desconhecido'));}
        finally {setStockExtraLoading(false);}
      },[companyId,client]);
      React.useEffect(()=>{setStockAddons([]);setStockRemovals([]);setAddonLinks([]);setRemovalLinks([]);setStockOrders([]);setStockExtraError('');setStockExtraNotice('');loadStockExtras();},[loadStockExtras]);
      const loadStockCombos = React.useCallback(async()=>{
        if(!companyId||companyId==='foodstrick-master')return;
        setStockComboLoading(true);setStockComboError('');
        try{
          const {data,error}=await client.from('foodstrick_combos').select('id,name,foodstrick_combo_items(id,product_id,quantity)').eq('company_id',companyId).order('name');
          if(error)throw error;
          setStockComboData(data||[]);
        }catch(e){setStockComboError('Não foi possível consultar combos: '+(e.message||'erro desconhecido'));}
        finally{setStockComboLoading(false);}
      },[companyId,client]);
      React.useEffect(()=>{loadStockCombos();},[loadStockCombos]);
      async function saveStockAddon(e){
        e.preventDefault();const qty=number(stockAddonQty);
        if(!stockAddons.some(a=>a.id===stockAddon)||!items.some(i=>i.id===stockAddonItem&&i.active)||!Number.isFinite(qty)||qty<=0||!/^\d+(?:[.,]\d{1,3})?$/.test(stockAddonQty.trim())){setStockExtraError('Selecione adicional, item ativo e quantidade válida.');return;}
        setStockExtraBusy(true);setStockExtraError('');setStockExtraNotice('');
        const {error:err}=await client.from('fs_stock_addon_components').upsert({company_id:companyId,addon_id:stockAddon,stock_item_id:stockAddonItem,quantity:qty},{onConflict:'company_id,addon_id,stock_item_id'});
        setStockExtraBusy(false);if(err){setStockExtraError(err.message);return;}
        setStockExtraNotice('Consumo do adicional salvo.');setStockAddonQty('');await loadStockExtras();
      }
      async function removeStockAddon(row){
        if(!window.confirm('Remover o consumo deste adicional?'))return;
        setStockExtraBusy(true);setStockExtraError('');
        const {error:err}=await client.from('fs_stock_addon_components').delete().eq('company_id',companyId).eq('addon_id',row.addon_id).eq('stock_item_id',row.stock_item_id);
        setStockExtraBusy(false);if(err){setStockExtraError(err.message);return;}setStockExtraNotice('Vínculo removido.');await loadStockExtras();
      }
      async function saveStockRemoval(e){
        e.preventDefault();
        if(!stockRemovals.some(a=>a.id===stockRemoval)||!items.some(i=>i.id===stockRemovalItem&&i.item_type==='ingredient'&&i.active)){setStockExtraError('Selecione uma remoção e um ingrediente ativo.');return;}
        setStockExtraBusy(true);setStockExtraError('');setStockExtraNotice('');
        const {error:err}=await client.from('fs_stock_removal_components').upsert({company_id:companyId,ingredient_id:stockRemoval,stock_item_id:stockRemovalItem},{onConflict:'company_id,ingredient_id,stock_item_id'});
        setStockExtraBusy(false);if(err){setStockExtraError(err.message);return;}setStockExtraNotice('Remoção vinculada ao ingrediente.');await loadStockExtras();
      }
      async function removeStockRemoval(row){
        if(!window.confirm('Remover este vínculo?'))return;
        setStockExtraBusy(true);setStockExtraError('');
        const {error:err}=await client.from('fs_stock_removal_components').delete().eq('company_id',companyId).eq('ingredient_id',row.ingredient_id).eq('stock_item_id',row.stock_item_id);
        setStockExtraBusy(false);if(err){setStockExtraError(err.message);return;}setStockExtraNotice('Vínculo removido.');await loadStockExtras();
      }
      const stockItemLabel=id=>items.find(i=>i.id===id)?.name||'Item não encontrado';
      const stockProductLabel=id=>products.find(p=>p.id===id)?.nome||'Produto não encontrado';
      async function createItem(e){
        e.preventDefault();
        const min=number(minimum);
        if(!name.trim() || !Number.isFinite(min) || min<0 || !/^\d+(?:[.,]\d{1,3})?$/.test(minimum.trim())){setError('Informe nome e estoque mínimo válido (até 3 casas decimais).');return;}
        setBusy(true);setError('');setNotice('');
        const {error:err}=await client.from('fs_stock_items').insert({company_id:companyId,name:name.trim(),item_type:type,unit,minimum_quantity:min});
        setBusy(false);
        if(err){setError(err.message);return;}
        setName('');setMinimum('0');setNotice('Item cadastrado. Registre uma entrada para informar o saldo inicial.');await load();
      }
      async function createMovement(e){
        e.preventDefault();
        const qty=number(quantity), item=items.find(x=>x.id===selected);
        if(!item || !Number.isFinite(qty) || qty<=0 || !/^\d+(?:[.,]\d{1,3})?$/.test(quantity.trim())){setError('Selecione um item e uma quantidade válida (até 3 casas decimais).');return;}
        if((movement==='exit'||movement==='adjustment_minus') && qty>Number(item.current_quantity)) {setError('Quantidade maior que o saldo exibido. Atualize os dados antes de continuar.');return;}
        setBusy(true);setError('');setNotice('');
        const {error:err}=await client.from('fs_stock_movements').insert({company_id:companyId,stock_item_id:selected,movement_type:movement,quantity:qty,reason:reason.trim()});
        setBusy(false);
        if(err){setError(err.message);return;}
        setQuantity('');setReason('');setNotice('Movimentação registrada.');await load();
      }
      async function updateMinimum(e){
        e.preventDefault();const min=number(editMinimum);
        if(!Number.isFinite(min)||min<0||!/^\d+(?:[.,]\d{1,3})?$/.test(editMinimum.trim())){setError('Estoque mínimo inválido.');return;}
        setBusy(true);setError('');
        const {error:err}=await client.from('fs_stock_items').update({minimum_quantity:min,updated_at:new Date().toISOString()}).eq('company_id',companyId).eq('id',savingId);
        setBusy(false);
        if(err){setError(err.message);return;}
        setSavingId(null);setNotice('Estoque mínimo atualizado.');await load();
      }
      async function saveRecipe(e){
        e.preventDefault();
        const qty=number(recipeQty);
        const product=products.find(p=>p.id===recipeProduct);
        const stock=items.find(i=>i.id===recipeStockItem && i.item_type==='ingredient' && i.active);
        if(!product || !stock || !/^\d+(?:[.,]\d{1,3})?$/.test(recipeQty.trim()) || !Number.isFinite(qty) || qty<=0){
          setError('Selecione produto, ingrediente ativo e quantidade válida (até 3 casas decimais).');return;
        }
        setRecipeBusy(true);setError('');setNotice('');
        const existing=recipes.find(r=>r.product_id===recipeProduct && r.stock_item_id===recipeStockItem);
        const payload={company_id:companyId,product_id:recipeProduct,stock_item_id:recipeStockItem,quantity:qty};
        const result=existing
          ? await client.from('fs_stock_recipe_components').update({quantity:qty,updated_at:new Date().toISOString()}).eq('id',existing.id).eq('company_id',companyId)
          : await client.from('fs_stock_recipe_components').insert(payload);
        setRecipeBusy(false);
        if(result.error){setError(result.error.message);return;}
        setRecipeQty('');setNotice(existing?'Quantidade atualizada.':'Ingrediente vinculado à receita.');await load();
      }
      async function removeRecipe(id){
        if(!window.confirm('Remover este vínculo da receita? O estoque não será movimentado.'))return;
        setRecipeBusy(true);setError('');setNotice('');
        const {error:err}=await client.from('fs_stock_recipe_components').delete().eq('id',id).eq('company_id',companyId);
        setRecipeBusy(false);
        if(err){setError(err.message);return;}
        setNotice('Vínculo removido.');await load();
      }
      async function linkFinished(e){
        e.preventDefault();
        const item=items.find(i=>i.id===finishedItem && i.item_type==='finished_product' && i.active && i.unit==='un');
        const product=products.find(p=>p.id===finishedProduct);
        if(!item || !product){setError('Selecione um produto pronto ativo (un.) e um produto cadastrado.');return;}
        const duplicate=items.find(i=>i.product_id===finishedProduct && i.id!==finishedItem);
        if(duplicate){setError('Este produto já está vinculado ao item de estoque '+duplicate.name+'.');return;}
        setFinishedBusy(true);setError('');setNotice('');
        const {error:err}=await client.from('fs_stock_items').update({product_id:finishedProduct,updated_at:new Date().toISOString()}).eq('id',finishedItem).eq('company_id',companyId).eq('item_type','finished_product');
        setFinishedBusy(false);
        if(err){setError(err.message);return;}
        setNotice('Produto pronto vinculado. A baixa automática usa este vínculo nos próximos pedidos pagos.');await load();
      }
      async function unlinkFinished(item){
        if(!window.confirm('Desvincular '+item.name+' do produto? Nenhum saldo será alterado.'))return;
        setFinishedBusy(true);setError('');setNotice('');
        const {error:err}=await client.from('fs_stock_items').update({product_id:null,updated_at:new Date().toISOString()}).eq('id',item.id).eq('company_id',companyId);
        setFinishedBusy(false);
        if(err){setError(err.message);return;}
        setNotice('Produto desvinculado.');await load();
      }
      const recipeRows=recipes.filter(r=>r.product_id===recipeProduct);
      const low=items.filter(i=>i.active && Number(i.current_quantity)<=Number(i.minimum_quantity));
      const btn='px-4 py-2.5 rounded-lg text-xs font-semibold bg-[#D95B1E] text-white disabled:opacity-50';
      const input='w-full bg-[#202020] border border-[#393939] rounded-lg px-3 py-2.5 text-sm text-white outline-none focus:border-[#D95B1E]';
      const panel='rounded-xl border border-[#303034] bg-[#18181a] p-4';
      return <div className="max-w-6xl space-y-5">
        <div className="flex flex-wrap items-center justify-between gap-3"><div><h1 className="text-xl sm:text-2xl font-bold text-white">Estoque Inteligente</h1><p className="text-xs text-zinc-400 mt-1">Ingredientes, produtos prontos e baixas automáticas por pagamento</p></div><button type="button" onClick={load} disabled={loading||busy} className="px-4 py-2 rounded-lg border border-[#393939] text-xs text-zinc-200 disabled:opacity-50">{loading?'Atualizando...':'Atualizar estoque'}</button></div>
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">{[["Itens",items.filter(i=>i.active).length],["Ingredientes",items.filter(i=>i.item_type==='ingredient'&&i.active).length],["Produtos prontos",items.filter(i=>i.item_type==='finished_product'&&i.active).length],["Estoque baixo",low.length]].map(([label,val])=><div key={label} className={panel}><p className="text-xs text-zinc-400">{label}</p><p className="text-2xl font-bold text-white mt-2">{val}</p></div>)}</div>
        {error&&<p role="alert" className="rounded-lg border border-red-900 bg-red-950/40 p-3 text-xs text-red-300">{error}</p>}
        {notice&&<p role="status" className="rounded-lg border border-emerald-900 bg-emerald-950/30 p-3 text-xs text-emerald-300">{notice}</p>}
        <div className="flex flex-wrap gap-2">{[['items','Itens e saldos'],['new','Cadastrar item'],['movement','Movimentar'],['history','Histórico'],['recipes','Vincular receitas'],['finished','Produtos prontos'],['combos-stock','Combos'],['addons-stock','Adicionais'],['removals-stock','Remoções'],['automatic-stock','Baixas automáticas']].map(([id,label])=><button type="button" key={id} onClick={()=>{setTab(id);setError('');setNotice('');}} className={`px-4 py-2.5 rounded-lg text-xs font-semibold ${tab===id?'bg-[#D95B1E] text-white':'bg-[#242426] text-zinc-300'}`}>{label}</button>)}</div>
        {tab==='items'&&<div className={panel}><h2 className="text-sm font-bold mb-3">Itens cadastrados</h2>{!items.length?<p className="text-xs text-zinc-400">Nenhum item cadastrado ainda. Use “Cadastrar item” para começar.</p>:<div className="space-y-2">{items.map(i=><div key={i.id} className="flex flex-wrap items-center justify-between gap-3 border-b border-[#303034] py-3"><div><p className="text-sm font-semibold text-white">{i.name}</p><p className="text-xs text-zinc-400">{i.item_type==='ingredient'?'Ingrediente':'Produto pronto'} • Mínimo: {fmt(i.minimum_quantity)} {units[i.unit]}</p></div><div className="flex items-center gap-3"><span className={`text-sm font-bold ${Number(i.current_quantity)<=Number(i.minimum_quantity)?'text-amber-400':'text-emerald-400'}`}>{fmt(i.current_quantity)} {units[i.unit]}</span><button type="button" onClick={()=>{setSavingId(i.id);setEditMinimum(String(i.minimum_quantity));}} className="text-xs text-[#f28a54]">Editar mínimo</button></div></div>)}</div>}</div>}
        {tab==='new'&&<form onSubmit={createItem} className={`${panel} space-y-3`}><h2 className="text-sm font-bold">Novo item de estoque</h2><label className="block text-xs text-zinc-400">Nome<input className={`${input} mt-1`} maxLength={160} required value={name} onChange={e=>setName(e.target.value)} placeholder="Ex.: Carne bovina, Coca-Cola lata"/></label><div className="grid grid-cols-1 sm:grid-cols-3 gap-3"><label className="text-xs text-zinc-400">Tipo<select className={`${input} mt-1`} value={type} onChange={e=>setType(e.target.value)}><option value="ingredient">Ingrediente</option><option value="finished_product">Produto pronto</option></select></label><label className="text-xs text-zinc-400">Unidade<select className={`${input} mt-1`} value={unit} onChange={e=>setUnit(e.target.value)}>{Object.keys(units).map(u=><option key={u} value={u}>{u}</option>)}</select></label><label className="text-xs text-zinc-400">Estoque mínimo<input className={`${input} mt-1`} inputMode="decimal" value={minimum} onChange={e=>setMinimum(e.target.value)} required/></label></div><button className={btn} disabled={busy||!companyId}>{busy?'Salvando...':'Cadastrar item'}</button></form>}
        {tab==='movement'&&<form onSubmit={createMovement} className={`${panel} space-y-3`}><h2 className="text-sm font-bold">Registrar movimentação</h2><label className="block text-xs text-zinc-400">Item<select required className={`${input} mt-1`} value={selected} onChange={e=>setSelected(e.target.value)}><option value="">Selecione</option>{items.filter(i=>i.active).map(i=><option key={i.id} value={i.id}>{i.name} — {fmt(i.current_quantity)} {i.unit}</option>)}</select></label><div className="grid grid-cols-1 sm:grid-cols-2 gap-3"><label className="text-xs text-zinc-400">Tipo<select className={`${input} mt-1`} value={movement} onChange={e=>setMovement(e.target.value)}><option value="entry">Entrada / reposição</option><option value="exit">Saída manual</option><option value="adjustment_plus">Ajuste positivo</option><option value="adjustment_minus">Ajuste negativo</option></select></label><label className="text-xs text-zinc-400">Quantidade<input className={`${input} mt-1`} required inputMode="decimal" value={quantity} onChange={e=>setQuantity(e.target.value)} placeholder="Ex.: 1 ou 150,5"/></label></div><label className="block text-xs text-zinc-400">Motivo (opcional)<input className={`${input} mt-1`} maxLength={500} value={reason} onChange={e=>setReason(e.target.value)} placeholder="Ex.: Compra de fornecedor"/></label><p className="text-xs text-amber-300">Saídas manuais são independentes das baixas automáticas por pedidos pagos.</p><button className={btn} disabled={busy||!selected}>{busy?'Salvando...':'Registrar movimentação'}</button></form>}
        {tab==='recipes'&&<div className={`${panel} space-y-4`}>
          <div><h2 className="text-sm font-bold">Vincular ingredientes às receitas</h2><p className="text-xs text-zinc-400 mt-1">Associe ingredientes do estoque aos produtos cadastrados. A receita vinculada é usada na baixa automática após a confirmação do pagamento.</p></div>
          <label className="block text-xs text-zinc-400">Produto da ficha técnica<select className={`${input} mt-1`} value={recipeProduct} onChange={e=>{setRecipeProduct(e.target.value);setRecipeStockItem('');setRecipeQty('');}}><option value="">Selecione um produto</option>{products.map(p=><option key={p.id} value={p.id}>{p.nome}</option>)}</select></label>
          {recipeProduct&&<><div className="space-y-2"><p className="text-xs font-bold">Ingredientes vinculados</p>{!recipeRows.length?<p className="text-xs text-zinc-400">Nenhum ingrediente vinculado a este produto.</p>:recipeRows.map(r=>{const item=items.find(i=>i.id===r.stock_item_id);return <div key={r.id} className="flex flex-wrap justify-between items-center gap-2 border-b border-[#303034] py-2"><div className="text-xs">{item?.name||'Ingrediente indisponível'} <span className="text-zinc-400">• {fmt(r.quantity)} {item?.unit||''} por unidade vendida</span></div><button type="button" disabled={recipeBusy} onClick={()=>removeRecipe(r.id)} className="text-xs text-red-400 disabled:opacity-50">Remover</button></div>})}</div>
          <form onSubmit={saveRecipe} className="space-y-3 border-t border-[#303034] pt-4"><h3 className="text-xs font-bold">Adicionar ou atualizar ingrediente</h3><div className="grid grid-cols-1 sm:grid-cols-2 gap-3"><label className="block text-xs text-zinc-400">Ingrediente<select required className={`${input} mt-1`} value={recipeStockItem} onChange={e=>{const id=e.target.value;setRecipeStockItem(id);const old=recipes.find(r=>r.product_id===recipeProduct&&r.stock_item_id===id);setRecipeQty(old?String(old.quantity):'');}}><option value="">Selecione</option>{items.filter(i=>i.item_type==='ingredient'&&i.active).map(i=><option key={i.id} value={i.id}>{i.name} ({i.unit})</option>)}</select></label><label className="block text-xs text-zinc-400">Quantidade por produto<input required className={`${input} mt-1`} inputMode="decimal" placeholder="Ex.: 100" value={recipeQty} onChange={e=>setRecipeQty(e.target.value)}/></label></div><p className="text-xs text-amber-300">A quantidade usa a unidade do ingrediente cadastrado (g, kg, ml, l ou un). Confira a equivalência antes de salvar.</p><button className={btn} disabled={recipeBusy||!recipeStockItem}>{recipeBusy?'Salvando...':'Salvar vínculo'}</button></form></>}
          {!products.length&&<p className="text-xs text-amber-300">Nenhum produto encontrado nesta empresa.</p>}
        </div>}
        {tab==='finished'&&<div className={`${panel} space-y-4`}>
          <div><h2 className="text-sm font-bold">Vincular produtos prontos</h2><p className="text-xs text-zinc-400 mt-1">Associe um produto vendido diretamente a um item de estoque, como refrigerantes em lata. Vendas pagas podem descontar automaticamente os produtos vinculados.</p></div>
          <form onSubmit={linkFinished} className="space-y-3">
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <label className="block text-xs text-zinc-400">Item do estoque (unidades)<select required className={`${input} mt-1`} value={finishedItem} onChange={e=>{setFinishedItem(e.target.value);setFinishedProduct(items.find(i=>i.id===e.target.value)?.product_id||'');}}><option value="">Selecione um item</option>{items.filter(i=>i.item_type==='finished_product'&&i.active&&i.unit==='un').map(i=><option key={i.id} value={i.id}>{i.name}</option>)}</select></label>
              <label className="block text-xs text-zinc-400">Produto cadastrado<select required className={`${input} mt-1`} value={finishedProduct} onChange={e=>setFinishedProduct(e.target.value)}><option value="">Selecione um produto</option>{products.map(p=><option key={p.id} value={p.id}>{p.nome}</option>)}</select></label>
            </div>
            <p className="text-xs text-amber-300">Para produtos vendidos por unidade, cadastre o estoque em “un”. Cada unidade vendida consome uma unidade quando a baixa automática processa o pedido pago.</p>
            <button className={btn} disabled={finishedBusy||!finishedItem||!finishedProduct}>{finishedBusy?'Salvando...':'Salvar vínculo'}</button>
          </form>
          <div className="border-t border-[#303034] pt-3 space-y-2"><h3 className="text-xs font-bold">Produtos prontos cadastrados</h3>
            {!items.some(i=>i.item_type==='finished_product')?<p className="text-xs text-zinc-400">Cadastre um produto pronto em “Cadastrar item” para começar.</p>:items.filter(i=>i.item_type==='finished_product').map(i=><div key={i.id} className="flex flex-wrap items-center justify-between gap-3 border-b border-[#303034] py-2"><div><p className="text-xs font-semibold">{i.name} <span className="text-zinc-400">({i.unit})</span></p><p className="text-xs text-zinc-400">{i.product_id?'Vinculado a: '+(products.find(p=>p.id===i.product_id)?.nome||'Produto indisponível'):'Ainda sem vínculo'}</p></div>{i.product_id&&<button type="button" disabled={finishedBusy} onClick={()=>unlinkFinished(i)} className="text-xs text-red-400 disabled:opacity-50">Desvincular</button>}</div>)}
          </div>
        </div>}
        {(tab==='addons-stock'||tab==='removals-stock'||tab==='automatic-stock')&&<div className={`${panel} space-y-4`}>
          <div className="flex flex-wrap justify-between items-center gap-2"><div><h2 className="text-sm font-bold">{tab==='addons-stock'?'Consumo dos adicionais':tab==='removals-stock'?'Remoções de ingredientes':'Auditoria das baixas automáticas'}</h2><p className="text-xs text-zinc-400 mt-1">Configurações isoladas por restaurante. As baixas são realizadas no Supabase após o pagamento.</p></div><button type="button" onClick={loadStockExtras} disabled={stockExtraLoading||stockExtraBusy} className="px-3 py-2 rounded-lg border border-[#393939] text-xs">{stockExtraLoading?'Carregando...':'Atualizar'}</button></div>
          {stockExtraError&&<p role="alert" className="rounded-lg border border-red-900 bg-red-950/30 p-3 text-xs text-red-300">{stockExtraError}</p>}
          {stockExtraNotice&&<p role="status" className="rounded-lg border border-emerald-900 bg-emerald-950/30 p-3 text-xs text-emerald-300">{stockExtraNotice}</p>}
          {tab==='addons-stock'&&<>
            <p className="text-xs text-zinc-400">Cadastre os adicionais na área Cardápio Online. Aqui informe o consumo de estoque por unidade do adicional. É possível vincular vários ingredientes a um adicional.</p>
            <form onSubmit={saveStockAddon} className="grid grid-cols-1 sm:grid-cols-4 gap-3 items-end">
              <label className="text-xs text-zinc-400">Adicional<select required className={`${input} mt-1`} value={stockAddon} onChange={e=>setStockAddon(e.target.value)}><option value="">Selecione</option>{stockAddons.filter(a=>a.active).map(a=><option key={a.id} value={a.id}>{a.name}</option>)}</select></label>
              <label className="text-xs text-zinc-400">Item do estoque<select required className={`${input} mt-1`} value={stockAddonItem} onChange={e=>setStockAddonItem(e.target.value)}><option value="">Selecione</option>{items.filter(i=>i.active).map(i=><option key={i.id} value={i.id}>{i.name} ({i.unit})</option>)}</select></label>
              <label className="text-xs text-zinc-400">Quantidade por adicional<input required className={`${input} mt-1`} inputMode="decimal" placeholder="Ex.: 30" value={stockAddonQty} onChange={e=>setStockAddonQty(e.target.value)}/></label>
              <button className={btn} disabled={stockExtraBusy||!stockExtraAvailable}>Salvar vínculo</button>
            </form>

          </>}
          {tab==='removals-stock'&&<>

              <label className="text-xs text-zinc-400">Ingrediente do estoque<select required className={`${input} mt-1`} value={stockRemovalItem} onChange={e=>setStockRemovalItem(e.target.value)}><option value="">Selecione</option>{items.filter(i=>i.active&&i.item_type==='ingredient').map(i=><option key={i.id} value={i.id}>{i.name} ({i.unit})</option>)}</select></label>
              <button className={btn} disabled={stockExtraBusy||!stockExtraAvailable}>Salvar vínculo</button>
            </form>
            {!removalLinks.length?<p className="text-xs text-zinc-500">Nenhuma remoção vinculada.</p>:removalLinks.map(r=><div key={r.ingredient_id+'-'+r.stock_item_id} className="flex flex-wrap justify-between gap-2 border-b border-[#303034] py-2 text-xs"><span>{stockRemovals.find(a=>a.id===r.ingredient_id)?.name||'Remoção indisponível'} → {stockItemLabel(r.stock_item_id)}</span><button type="button" disabled={stockExtraBusy} className="text-red-400" onClick={()=>removeStockRemoval(r)}>Remover</button></div>)}
          </>}
          {tab==='automatic-stock'&&<>
            <p className="text-xs text-zinc-400">Últimos 50 registros de processamento. O histórico de saídas por pedido também aparece na aba Histórico.</p>
            {!stockOrders.length?<p className="text-xs text-zinc-500">Nenhum processamento registrado ou nenhum registro visível para esta conta.</p>:stockOrders.map((r,i)=><div key={r.order_id+'-'+r.operation+'-'+i} className="border-b border-[#303034] py-3 text-xs space-y-1"><div className="flex flex-wrap justify-between gap-2"><span className="font-semibold text-white">Pedido {String(r.order_id).slice(0,8)}…</span><span className={r.status==='applied'?'text-emerald-400':r.status==='failed'?'text-red-400':'text-amber-400'}>{r.status==='applied'?'Aplicado':r.status==='failed'?'Falhou':r.status||'Pendente'}</span></div><p className="text-zinc-500">{r.created_at?new Date(r.created_at).toLocaleString('pt-BR'):''}{r.applied_at?' • Baixa: '+new Date(r.applied_at).toLocaleString('pt-BR'):''}</p>{r.error_message&&<p className="text-amber-300 break-words">{r.error_message}</p>}</div>)}
          </>}
        </div>}
        {tab==='combos-stock'&&<div className={`${panel} space-y-4`}>
          <div className="flex flex-wrap justify-between items-center gap-2"><div><h2 className="text-sm font-bold">Consumo de estoque dos combos</h2><p className="text-xs text-zinc-400 mt-1">A composição é herdada dos combos já cadastrados no Cardápio Online. Cada produto utiliza sua receita ou vínculo de produto pronto.</p></div><button type="button" onClick={async()=>{await Promise.all([loadStockCombos(),load()]);}} disabled={stockComboLoading||loading} className="px-3 py-2 rounded-lg border border-[#393939] text-xs">Atualizar</button></div>
          {stockComboError&&<p role="alert" className="text-xs text-red-300">{stockComboError}</p>}
          {!stockComboData.length?<p className="text-xs text-zinc-500">Nenhum combo cadastrado nesta empresa.</p>:stockComboData.map(c=><div key={c.id} className="border-b border-[#303034] py-3"><h3 className="text-sm font-semibold">{c.name}</h3>{!(c.foodstrick_combo_items||[]).length?<p className="text-xs text-amber-300">Combo sem produtos vinculados no Cardápio Online.</p>:(c.foodstrick_combo_items||[]).map(ci=>{const rec=recipes.filter(r=>r.product_id===ci.product_id);const fin=items.filter(i=>i.product_id===ci.product_id&&i.item_type==='finished_product'&&i.active);const valid=(rec.length>0?1:0)+(fin.length>0?1:0)===1;return <div key={ci.id} className="flex flex-wrap justify-between gap-2 text-xs mt-2"><span>{fmt(ci.quantity)} × {stockProductLabel(ci.product_id)}</span><span className={valid?'text-emerald-400':'text-amber-300'}>{valid?(rec.length?rec.map(r=>`${fmt(Number(ci.quantity)*Number(r.quantity))} ${items.find(i=>i.id===r.stock_item_id)?.unit||''} ${stockItemLabel(r.stock_item_id)}`).join(' + '):`${fmt(ci.quantity)} un. ${fin[0]?.name}`):'Sem vínculo único de estoque'}</span></div>;})}</div>)}
          <p className="text-xs text-zinc-500">Para editar a composição do combo, utilize o editor de combos já existente no Cardápio Online.</p>
        </div>}
        {tab==='history'&&<div className={panel}><h2 className="text-sm font-bold mb-3">Últimas 100 movimentações</h2>{!history.length?<p className="text-xs text-zinc-400">Nenhuma movimentação registrada.</p>:<div className="space-y-2">{history.map(m=><div key={m.id} className="border-b border-[#303034] py-2 flex justify-between gap-3"><div><p className="text-xs font-semibold">{items.find(i=>i.id===m.stock_item_id)?.name||'Item'}</p><p className="text-[11px] text-zinc-400">{new Date(m.created_at).toLocaleString('pt-BR')} • {m.reason||'Sem observação'}{m.reference_type==='foodstrick_order'&&m.reference_id?' • Pedido '+String(m.reference_id).slice(0,8)+'…':''}</p></div><p className={`text-xs font-bold ${['entry','adjustment_plus'].includes(m.movement_type)?'text-emerald-400':'text-amber-400'}`}>{['entry','adjustment_plus'].includes(m.movement_type)?'+':'−'}{fmt(m.quantity)}</p></div>)}</div>}</div>}
        {savingId&&<div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4"><form onSubmit={updateMinimum} className="w-full max-w-sm rounded-xl bg-[#1d1d20] border border-[#383838] p-5 space-y-4"><h3 className="font-bold">Editar estoque mínimo</h3><input className={input} value={editMinimum} inputMode="decimal" onChange={e=>setEditMinimum(e.target.value)}/><div className="flex justify-end gap-2"><button type="button" onClick={()=>setSavingId(null)} className="px-4 py-2 text-xs text-zinc-300">Cancelar</button><button className={btn} disabled={busy}>Salvar</button></div></form></div>}
      </div>;
    }

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [authLoading, setAuthLoading] = useState(true);
      const [authScreen, setAuthScreen] = useState(RECOVERY_LINK_OPENED ? 'reset' : 'login');
      const [recoveryEmail, setRecoveryEmail] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [recoveryBusy, setRecoveryBusy] = useState(false);
      const [recoveryMessage, setRecoveryMessage] = useState('');
      const [recoveryReady, setRecoveryReady] = useState(false);

      useEffect(() => {
        let alive = true;
        async function loadSession() {
          try {
            const { data: { user }, error } = await supabaseClient.auth.getUser();
            if (!user) { if (alive) { setCurrentUser(null); setIsAuthenticated(false); } return; }
            if (error) throw error;
            const { data: profile, error: profileError } = await supabaseClient
              .from('foodstrick_auth_profiles').select('username,role,company_id,avatar_url')
              .eq('user_id', user.id).single();
            if (profileError || !profile) throw new Error('Conta sem perfil FoodStrick. Contate o administrador.');
            if (alive) {
              setCurrentUser({ ...profile, unidade: profile.company_id === 'foodstrick-master' ? 'FoodStrick Master' : profile.company_id });
              setIsAuthenticated(true);
            }
          } catch (err) {
            if (alive) { setCurrentUser(null); setIsAuthenticated(false); setAuthError(err.message || 'Falha ao validar a sessão.'); }
          } finally { if (alive) setAuthLoading(false); }
        }
        loadSession();
        const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((event, session) => {
          if (event === 'PASSWORD_RECOVERY') {
            setAuthScreen('reset');
            setRecoveryReady(!!session);
            setRecoveryMessage('');
          }
          if (RECOVERY_LINK_OPENED && session) setRecoveryReady(true);
          // Não consultar Supabase dentro do callback para evitar bloqueios de auth.
          setTimeout(loadSession, 0);
        });
        return () => { alive = false; subscription.unsubscribe(); };
      }, []);

      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [impersonatedCompany, setImpersonatedCompany] = useState(null);
      const [adminInsideNotification, setAdminInsideNotification] = useState(null);

      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [authError, setAuthError] = useState('');

      const [abaAtiva, setAbaAtiva] = useState('painel'); 
      const [subAbaConfig, setSubAbaConfig] = useState('conta'); 

      // Cache isolado especificamente pela empresa conectada
      const activeCompId = impersonatedCompany ? impersonatedCompany.company_id : currentUser?.company_id;

      const [produtos, setProdutos] = useState(() => {
        try {
          if (!activeCompId) return [];
          const c = localStorage.getItem(`cache_prods_${activeCompId}`);
          return c ? JSON.parse(c) : [];
        } catch(e) { return []; }
      });

      const [lancamentos, setLancamentos] = useState(() => {
        try {
          if (!activeCompId) return [];
          const c = localStorage.getItem(`cache_lancs_${activeCompId}`);
          return c ? JSON.parse(c) : [];
        } catch(e) { return []; }
      });

      const [historicoFechamentos, setHistoricoFechamentos] = useState([]);
      const [processandoFechamento, setProcessandoFechamento] = useState(false);
      const [extratoSelecionado, setExtratoSelecionado] = useState(null);

      const [modalExclusao, setModalExclusao] = useState({ aberto: false, idLancamento: null });
      const [motivoExclusao, setMotivoExclusao] = useState('Pedido cancelado');
      const [modalExcluirProduto, setModalExcluirProduto] = useState({ aberto: false, idProduto: null, nome: '' });
      
      const [modalEditarProduto, setModalEditarProduto] = useState({ aberto: false, id: null, nome: '', preco_venda: '', custo_unitario: '', observacao: '' });
      const [modalFichaTecnica, setModalFichaTecnica] = useState({ aberto: false, produto: null });
      const [novoInsumo, setNovoInsumo] = useState({ nome: '', quantidade: '', custo: '' });

      const [novoLancamento, setNovoLancamento] = useState({
        data: new Date().toISOString().split('T')[0],
        tipo: 'Venda', produto_id: '', descricao: '', quantidade: 1, 
        pagamento: 'Pix', canal_categoria: 'Delivery', valor_despesa: '', fornecedor: ''
      });

      const [novoProduto, setNovoProduto] = useState({ nome: '', preco_venda: '', custo_unitario: '', observacao: '' });

      // Cardápio Online: dados separados por estabelecimento
      const [ipHandle, setIpHandle] = useState('');
      const [ipKey, setIpKey] = useState('');
      const [ipSaving, setIpSaving] = useState(false);
      const [menuSettings, setMenuSettings] = useState({ menu_enabled: true, menu_slug: '', menu_description: '', menu_accent_color: '#D95B1E', menu_cover_image: '', menu_allow_delivery: true, menu_allow_pickup: true, menu_payment_methods: ['Pix', 'Dinheiro', 'Cartão'], pix_manual_enabled: false, pix_key: '', pix_receiver_name: '', pix_receiver_city: '', pix_auto_enabled: false, pix_provider: 'infinitepay' });
      const [menuProductForm, setMenuProductForm] = useState({ id: null, nome: '', preco_venda: '', custo_unitario: '0', menu_description: '', menu_ingredients: '', menu_category: 'Pratos', menu_image_url: '', menu_available: true });
      const [coverEditorSource, setCoverEditorSource] = useState(null);
      const [menuSaving, setMenuSaving] = useState(false);
      const [menuLoaded, setMenuLoaded] = useState(false);
      const [menuSettingsError, setMenuSettingsError] = useState('');


      // Adicionais do cardápio: catálogo e vínculos por produto, isolados por empresa.
      const [addons, setAddons] = useState([]);
      const [productAddonLinks, setProductAddonLinks] = useState([]);
      const [addonForm, setAddonForm] = useState({ id:null, name:'', price:'', max_quantity:1, active:true });
      const [addonsBusy, setAddonsBusy] = useState(false);
      const [addonsLoading, setAddonsLoading] = useState(false);
      const [addonsError, setAddonsError] = useState('');
      const [addonProductId, setAddonProductId] = useState('');
      const [addonProductSelection, setAddonProductSelection] = useState([]);

      // Ingredientes removíveis: cadastro e associação por produto/empresa.
      const [removableIngredients, setRemovableIngredients] = useState([]);
      const [productRemovableLinks, setProductRemovableLinks] = useState([]);
      const [removableForm, setRemovableForm] = useState({id:null,name:'',active:true});
      const [removableBusy, setRemovableBusy] = useState(false);
      const [removableLoading, setRemovableLoading] = useState(false);
      const [removableError, setRemovableError] = useState('');
      const [removableProductId, setRemovableProductId] = useState('');
      const [removableSelection, setRemovableSelection] = useState([]);

      // Ponto da carne por produto: configuração opcional, sem alterar pedidos existentes.
      const [meatSettings, setMeatSettings] = useState([]);
      const [meatProductId, setMeatProductId] = useState('');
      const [meatEnabled, setMeatEnabled] = useState(false);
      const [meatOptions, setMeatOptions] = useState(['Ao ponto','Bem passada']);
      const [meatDefault, setMeatDefault] = useState('Ao ponto');
      const [meatBusy, setMeatBusy] = useState(false);
      const [meatError, setMeatError] = useState('');

      // Combo do Dia: gerenciamento isolado por empresa.
      const comboVazio = () => ({ id:null, name:'', description:'', image_url:'', price:'', mode:'disabled', manual_active:false, timezone:'America/Campo_Grande', items:[], schedules:[] });
      const [combos, setCombos] = useState([]);
      const [comboForm, setComboForm] = useState(comboVazio);
      const [comboBusy, setComboBusy] = useState(false);
      const [comboLoading, setComboLoading] = useState(false);
      const [comboError, setComboError] = useState('');
      const [comboEditorOpen, setComboEditorOpen] = useState(false);

      // Pedidos recebidos pelo cardápio público
      const [pedidosOnline, setPedidosOnline] = useState([]);
      const [pedidosLoading, setPedidosLoading] = useState(false);
      const [pedidosError, setPedidosError] = useState('');
      const [pedidoAtualizando, setPedidoAtualizando] = useState(null);
      const [pagamentoAtualizando, setPagamentoAtualizando] = useState(null);
      const [pedidoExpandido, setPedidoExpandido] = useState(null);
      const [filtroPedidos, setFiltroPedidos] = useState('todos');

      const [companiesList, setCompaniesList] = useState([]);
      const [newCompanyName, setNewCompanyName] = useState('');
      const [newCompanySlug, setNewCompanySlug] = useState('');
      const [newCompanyPhone, setNewCompanyPhone] = useState('');
      const [newCompanyAdminUser, setNewCompanyAdminUser] = useState('');
      const [masterSaving, setMasterSaving] = useState(false);
      const [masterLoading, setMasterLoading] = useState(false);
      const [masterError, setMasterError] = useState('');
      const [supportBusy, setSupportBusy] = useState(false);
      const [supportError, setSupportError] = useState('');
      const [supportKey, setSupportKey] = useState('');
      const [supportKeyExpiry, setSupportKeyExpiry] = useState('');
      const [supportSessions, setSupportSessions] = useState({});
      const [supportKeyInputs, setSupportKeyInputs] = useState({});
      const [supportSelectedCompany, setSupportSelectedCompany] = useState('');


      const avatarInputRef = useRef(null);

      const isSuperAdmin = currentUser?.role === 'superadmin' && currentUser?.company_id === 'foodstrick-master';
      const effectiveCompanyId = impersonatedCompany ? impersonatedCompany.company_id : currentUser?.company_id;
      const effectiveCompanyName = impersonatedCompany ? impersonatedCompany.company_name : (currentUser?.unidade || 'FoodStrick');

      // Estado do suporte consultado no servidor, não no campo legado app_users.
      const [remoteSupportTab, setRemoteSupportTab] = useState('');
      useEffect(() => {
        if (!isAuthenticated || !currentUser || isSuperAdmin || !currentUser.company_id) return;
        let cancelled = false;
        const checkSupport = async () => {
          try {
            const { data, error } = await supabaseClient.functions.invoke('foodstrick-master-admin', {
              body: { action: 'support_status', company_id: currentUser.company_id }
            });
            if (error || !data?.success) throw error || new Error(data?.error || 'Falha na consulta');
            if (!cancelled) {
              setAdminInsideNotification(data.session?.id ? 'FoodStrick Master' : null);
              if (!data.session) setRemoteSupportTab('');
            }
          } catch (err) { console.warn('Não foi possível verificar o suporte:', err); }
        };
        checkSupport();
        const interval = setInterval(checkSupport, 5000);
        return () => { cancelled = true; clearInterval(interval); };
      }, [isAuthenticated, currentUser?.company_id, isSuperAdmin]);

      // Canal de navegação persistente: não recriar a conexão a cada clique.
      const supportNavChannelRef = useRef(null);
      const supportNavReadyRef = useRef(false);
      const supportNavTabRef = useRef('painel');
      const supportNavLastRef = useRef('');
      supportNavTabRef.current = abaAtiva;

      useEffect(() => {
        if (!isAuthenticated || !effectiveCompanyId || effectiveCompanyId === 'foodstrick-master') return;
        if (!impersonatedCompany && !adminInsideNotification) return;
        let alive = true;
        let lastRemoteSeq = 0;
        const channel = supabaseClient.channel(`fs-support-presence-${effectiveCompanyId}`);
        supportNavChannelRef.current = channel;
        supportNavReadyRef.current = false;

        const sendCurrentTab = () => {
          if (!alive || !impersonatedCompany || !supportNavReadyRef.current) return;
          const tab = supportNavTabRef.current;
          channel.send({ type: 'broadcast', event: 'support-tab', payload: {
            company_id: effectiveCompanyId, tab, seq: Date.now()
          }}).catch(err => console.warn('Falha na sincronização da aba:', err));
        };

        channel.on('broadcast', { event: 'support-tab' }, ({ payload }) => {
          if (isSuperAdmin || payload?.company_id !== effectiveCompanyId) return;
          const tabsPermitidas = ['painel','lancamentos','produtos','fichas','fechamento','pedidos','cardapio','configuracoes'];
          if (!tabsPermitidas.includes(payload.tab)) return;
          const seq = Number(payload.seq) || 0;
          if (seq && seq < lastRemoteSeq) return;
          if (seq) lastRemoteSeq = seq;
          setRemoteSupportTab(payload.tab);
          setAbaAtiva(previous => previous === payload.tab ? previous : payload.tab);
          setMobileMenuOpen(false);
        }).subscribe(status => {
          if (!alive) return;
          supportNavReadyRef.current = status === 'SUBSCRIBED';
          if (status === 'SUBSCRIBED') sendCurrentTab();
        });

        // Heartbeat leve: recupera a aba após uma reconexão, sem recriar o canal.
        const heartbeat = impersonatedCompany ? setInterval(sendCurrentTab, 15000) : null;
        return () => {
          alive = false;
          if (heartbeat) clearInterval(heartbeat);
          if (supportNavChannelRef.current === channel) {
            supportNavChannelRef.current = null;
            supportNavReadyRef.current = false;
          }
          supabaseClient.removeChannel(channel);
        };
      }, [isAuthenticated, effectiveCompanyId, isSuperAdmin, !!impersonatedCompany, !!adminInsideNotification]);

      // Envia imediatamente a mudança de aba; evita broadcasts duplicados.
      useEffect(() => {
        if (!impersonatedCompany || !supportNavReadyRef.current || !supportNavChannelRef.current) return;
        const key = `${effectiveCompanyId}:${abaAtiva}`;
        if (supportNavLastRef.current === key) return;
        supportNavLastRef.current = key;
        supportNavChannelRef.current.send({ type: 'broadcast', event: 'support-tab', payload: {
          company_id: effectiveCompanyId, tab: abaAtiva, seq: Date.now()
        }}).catch(err => console.warn('Falha ao enviar aba:', err));
      }, [abaAtiva, effectiveCompanyId, !!impersonatedCompany]);

      // CARREGAMENTO RIGOROSO: Cada empresa acede unicamente aos seus dados
      useEffect(() => {
        if (isAuthenticated && effectiveCompanyId && effectiveCompanyId !== 'foodstrick-master') {
          carregarTudoEmParalelo(effectiveCompanyId);
        }
      }, [isAuthenticated, effectiveCompanyId]);

      async function carregarTudoEmParalelo(compId) {
        try {
          let queryProd = supabaseClient.from('produtos').select('*');
          let queryLanc = supabaseClient.from('lancamentos').select('*');

          if (compId === 'cozinha-brasileira') {
            queryProd = queryProd.or('company_id.eq.cozinha-brasileira,company_id.is.null');
            queryLanc = queryLanc.or('company_id.eq.cozinha-brasileira,company_id.is.null');
          } else {
            queryProd = queryProd.eq('company_id', compId);
            queryLanc = queryLanc.eq('company_id', compId);
          }

          const [resProd, resLanc, resFech] = await Promise.all([
            queryProd.order('nome'),
            queryLanc.order('data', { ascending: false }),
            supabaseClient.from('fechamentos').select('*').eq('company_id', compId).order('data_fechamento', { ascending: false })
          ]);

          if (resProd.data) {
            setProdutos(resProd.data);
            localStorage.setItem(`cache_prods_${compId}`, JSON.stringify(resProd.data));
          }
          if (resLanc.data) {
            setLancamentos(resLanc.data);
            localStorage.setItem(`cache_lancs_${compId}`, JSON.stringify(resLanc.data));
          }
          if (resFech.data) setHistoricoFechamentos(resFech.data);
        } catch (err) {
          console.error("Erro na sincronização:", err);
        }
      }

      const handleLogin = async (e) => {
        e.preventDefault();
        setAuthError('');
        try {
          const { error } = await supabaseClient.auth.signInWithPassword({
            email: username.trim(), password
          });
          if (error) throw error;
          // O observador de auth carrega o perfil autorizado.
          setPassword('');
        } catch (err) { setAuthError(err.message || 'Falha no login.'); }
      };

      const handleRequestRecovery = async (e) => {
        e.preventDefault();
        setRecoveryBusy(true);
        setAuthError('');
        setRecoveryMessage('');
        try {
          const { error } = await supabaseClient.auth.resetPasswordForEmail(
            recoveryEmail.trim().toLowerCase(),
            { redirectTo: window.location.origin + window.location.pathname }
          );
          if (error) throw error;
          setRecoveryMessage('Se esse e-mail estiver cadastrado, você receberá um link para redefinir sua senha. Confira também a caixa de spam.');
        } catch (err) {
          setAuthError(err.message || 'Não foi possível solicitar a recuperação.');
        } finally { setRecoveryBusy(false); }
      };

      const handleSaveNewPassword = async (e) => {
        e.preventDefault();
        setAuthError('');
        setRecoveryMessage('');
        if (newPassword.length < 8) { setAuthError('Use uma senha com pelo menos 8 caracteres.'); return; }
        if (newPassword !== confirmPassword) { setAuthError('As senhas não coincidem.'); return; }

        const verify = async () => {
          try {
            const result = await supportCall('support_status', { company_id: impersonatedCompany.company_id });
            const expected = supportSessions[impersonatedCompany.company_id];

        };
        verify(); const timer = setInterval(verify, 10000);

      }, [impersonatedCompany?.company_id, supportSessions[impersonatedCompany?.company_id]?.id]);

      // Cálculos Financeiros
      const lancamentosAtivos = useMemo(() => lancamentos.filter(l => l.status === 'ativo' || l.status === null), [lancamentos]);
      const lancamentosExcluidos = useMemo(() => lancamentos.filter(l => l.status === 'excluido'), [lancamentos]);

      const { faturamento, lucroProdutos, totalDespesas, resultadoMes, totalBebidas, totalPratos } = useMemo(() => {
        let fat = 0, lucroP = 0, desp = 0, beb = 0, pratos = 0;
        for (let i = 0; i < lancamentosAtivos.length; i++) {
          const l = lancamentosAtivos[i];
          const val = Number(l.valor_total) || 0;
          if (l.tipo === 'Venda') {
            fat += val;
            lucroP += (val - (Number(l.custo_total) || 0));
            if (l.canal_categoria === 'Bebidas') beb += Number(l.quantidade || 0);
            else pratos += Number(l.quantidade || 0);
          } else if (l.tipo === 'Despesa') {
            desp += val;
          }
        }
        return { faturamento: fat, lucroProdutos: lucroP, totalDespesas: desp, resultadoMes: lucroP - desp, totalBebidas: beb, totalPratos: pratos };
      }, [lancamentosAtivos]);

      const arrayIngredientes = useMemo(() => {
        const mapa = {};
        const prodsMap = new Map(produtos.map(p => [p.id, p]));
        lancamentosAtivos.forEach(venda => {
          if (venda.tipo !== 'Venda') return;
          const prod = prodsMap.get(venda.produto_id);
          if (prod && Array.isArray(prod.ingredientes)) {
            prod.ingredientes.forEach(ing => {
              const num = parseFloat(ing.quantidade) || 1;
              const totalQtd = num * Number(venda.quantidade || 1);
              const unidade = String(ing.quantidade).replace(/[0-9.,]/g, '').trim() || 'un';
              if (!mapa[ing.nome]) mapa[ing.nome] = { qtd: 0, unidade: unidade, custoTotal: 0 };
              mapa[ing.nome].qtd += totalQtd;
              mapa[ing.nome].custoTotal += (Number(ing.custo || 0) * Number(venda.quantidade || 1));
            });
          }
        });
        return Object.entries(mapa).sort((a, b) => b[1].qtd - a[1].qtd);
      }, [lancamentosAtivos, produtos]);

        reader.onload=()=>{const img=new Image();img.onload=()=>{const ratio=Math.min(1,900/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*ratio);canvas.height=Math.round(img.height*ratio);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);setComboForm(f=>({...f,image_url:canvas.toDataURL('image/jpeg',0.75)}));};img.onerror=()=>setComboError('Imagem inválida.');img.src=reader.result;};

      async function salvarCombo(e) {
        e.preventDefault(); if(comboBusy)return;
        setComboError('');
        const price=Number(String(comboForm.price).replace(',','.'));
        const items=comboForm.items.filter(i=>i.product_id).map(i=>({product_id:i.product_id,quantity:Number(i.quantity)}));
        if(!comboForm.name.trim()||!Number.isFinite(price)||price<=0){setComboError('Informe nome e preço maior que zero.');return;}
        if(!items.length||items.some(i=>!Number.isInteger(i.quantity)||i.quantity<1)||new Set(items.map(i=>i.product_id)).size!==items.length){setComboError('Selecione produtos diferentes e quantidades inteiras positivas.');return;}
        if(items.some(i=>!produtos.some(p=>p.id===i.product_id && (p.company_id===effectiveCompanyId || (effectiveCompanyId==='cozinha-brasileira'&&!p.company_id))))){setComboError('Há produtos que não pertencem à empresa.');return;}
        const schedules=comboForm.schedules.map(x=>({weekday:Number(x.weekday),start_time:x.start_time,end_time:x.end_time}));
        if(comboForm.mode==='automatic' && (!schedules.length || schedules.some(x=>!Number.isInteger(x.weekday)||x.weekday<0||x.weekday>6||!/^\d{2}:\d{2}$/.test(x.start_time)||!/^\d{2}:\d{2}$/.test(x.end_time)||x.start_time>=x.end_time))){setComboError('Configure ao menos um horário válido (início anterior ao fim).');return;}
        setComboBusy(true);
        try {
          const payload={company_id:effectiveCompanyId,name:comboForm.name.trim(),description:comboForm.description.trim(),image_url:comboForm.image_url||null,price,mode:comboForm.mode,manual_active:comboForm.mode==='manual'?!!comboForm.manual_active:false,timezone:comboForm.timezone};
          let id=comboForm.id;
          if(id){
            const {data,error}=await supabaseClient.from('foodstrick_combos').update(payload).eq('id',id).eq('company_id',effectiveCompanyId).select('id').single();
            if(error)throw error; id=data.id;
          } else {
            // Cria desativado; ativa somente depois de salvar composição e horários.
            const {data,error}=await supabaseClient.from('foodstrick_combos').insert({...payload,mode:'disabled',manual_active:false}).select('id').single();
            if(error)throw error; id=data.id;
          }
          // Atualização da composição em duas etapas; se falhar, informa para revisão.
          const delItems=await supabaseClient.from('foodstrick_combo_items').delete().eq('combo_id',id);
          if(delItems.error)throw delItems.error;
          const addItems=await supabaseClient.from('foodstrick_combo_items').insert(items.map(x=>({...x,combo_id:id})));
          if(addItems.error)throw addItems.error;
          const delSchedules=await supabaseClient.from('foodstrick_combo_schedules').delete().eq('combo_id',id);
          if(delSchedules.error)throw delSchedules.error;
          if(schedules.length){const addSchedules=await supabaseClient.from('foodstrick_combo_schedules').insert(schedules.map(x=>({...x,combo_id:id})));if(addSchedules.error)throw addSchedules.error;}
          const activated=await supabaseClient.from('foodstrick_combos').update({mode:payload.mode,manual_active:payload.manual_active}).eq('id',id).eq('company_id',effectiveCompanyId);
          if(activated.error)throw activated.error;
          setComboEditorOpen(false);setComboForm(comboVazio());await carregarCombos();
        } catch(err){setComboError('Não foi possível concluir: '+(err.message||'erro desconhecido')+'. Confira o combo antes de tentar novamente.');await carregarCombos();}
        finally{setComboBusy(false);}
      }

      function handleMenuImageUpload(e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) { alert('Selecione um arquivo de imagem.'); e.target.value = ''; return; }
        if (file.size > 5 * 1024 * 1024) { alert('A imagem deve ter no máximo 5 MB.'); e.target.value = ''; return; }
        const reader = new FileReader();
        reader.onload = event => {
          const img = new Image();
          img.onload = () => {
            const maxSize = 900;
            let width = img.width, height = img.height;
            if (width > height && width > maxSize) { height = Math.round(height * maxSize / width); width = maxSize; }
            else if (height > maxSize) { width = Math.round(width * maxSize / height); height = maxSize; }
            const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            const compressed = canvas.toDataURL('image/jpeg', 0.78);
            setMenuProductForm(v => ({ ...v, menu_image_url: compressed }));
          };
          img.onerror = () => alert('Não foi possível ler essa imagem.');
          img.src = event.target.result;
        };
        reader.onerror = () => alert('Falha ao carregar a imagem.');
        reader.readAsDataURL(file);
      }

      function handleMenuCoverUpload(e) {
        const file = e.target.files?.[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) { alert('Escolha uma imagem válida.'); e.target.value = ''; return; }
        if (file.size > 8 * 1024 * 1024) { alert('A imagem deve ter até 8 MB.'); e.target.value = ''; return; }
        const reader = new FileReader();
        reader.onload = event => setCoverEditorSource(event.target.result);
        reader.onerror = () => alert('Não foi possível carregar o arquivo.');
        reader.readAsDataURL(file);
        e.target.value = '';
      }

      async function handleAdicionarInsumo(e) {
        e.preventDefault();
        if (!modalFichaTecnica.produto) return;
        const prod = modalFichaTecnica.produto;
        let listaAtual = [];
        if (Array.isArray(prod.ingredientes)) {
          listaAtual = prod.ingredientes;
        } else if (typeof prod.ingredientes === 'string') {
          try { listaAtual = JSON.parse(prod.ingredientes); } catch(err) { listaAtual = []; }
        }

        const rawCusto = String(novoInsumo.custo).replace('R$', '').replace(/\s/g, '').replace(',', '.');
        const item = { 
          id: Date.now().toString(), 
          nome: novoInsumo.nome.trim(), 
          quantidade: novoInsumo.quantidade.trim(), 
          custo: parseFloat(rawCusto) || 0 
        };

        const novaLista = [...listaAtual, item];
        const novoCustoTotal = novaLista.reduce((acc, curr) => acc + (Number(curr.custo) || 0), 0);

        const { error } = await supabaseClient
          .from('produtos')
          .update({ ingredientes: novaLista, custo_unitario: novoCustoTotal })
          .eq('id', prod.id);

        if (error) {
          alert("Erro ao adicionar ingrediente: " + error.message);
        } else {
          const prodAtualizado = { ...prod, ingredientes: novaLista, custo_unitario: novoCustoTotal };
          setModalFichaTecnica({ aberto: true, produto: prodAtualizado });
          setProdutos(prev => prev.map(p => p.id === prod.id ? prodAtualizado : p));
          setNovoInsumo({ nome: '', quantidade: '', custo: '' });
          carregarTudoEmParalelo(effectiveCompanyId);
        }
      }

            body: { action: 'set_company_status', company_id: companyId, status: nextStatus }
