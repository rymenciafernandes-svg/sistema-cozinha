          if (error) throw new Error(data?.error || error.message || 'Falha ao chamar o servidor.');
          if (!data?.success) throw new Error(data?.error || 'O servidor não confirmou a alteração.');
          await fetchCompanies();
          alert('Status da empresa atualizado.');
        } catch (err) {
          alert('Erro ao alterar status: ' + (err.message || 'Erro desconhecido'));
        } finally { setMasterSaving(false); }
      };

      const handleAvatarUpload = (e) => {
        const file = e.target.files[0];
        if (!file || !currentUser) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = async () => {
            const canvas = document.createElement('canvas');
            const maxSize = 250;
            let width = img.width, height = img.height;
            if (width > height) { if (width > maxSize) { height = Math.round((height * maxSize) / width); width = maxSize; } }
            else { if (height > maxSize) { width = Math.round((width * maxSize) / height); height = maxSize; } }
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.85);
            
            const updatedUser = { ...currentUser, avatar_url: compressedBase64 };
            setCurrentUser(updatedUser);
            // Sessão é gerenciada pelo Supabase Auth; perfil precisa de endpoint autorizado.
            // Atualização do avatar deve migrar para endpoint autorizado.
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleRemoveAvatar = async () => {
        if (!currentUser) return;
        const updatedUser = { ...currentUser, avatar_url: null };
        setCurrentUser(updatedUser);
        // Sessão é gerenciada pelo Supabase Auth; perfil precisa de endpoint autorizado.
        // Atualização do avatar deve migrar para endpoint autorizado.
      };

      const isSupportSessionActive = Boolean(impersonatedCompany || adminInsideNotification);

      useEffect(() => {
        if (isAuthenticated && abaAtiva === 'cardapio' && effectiveCompanyId && effectiveCompanyId !== 'foodstrick-master') {
          carregarConfiguracaoCardapio(effectiveCompanyId);
          carregarCombos(effectiveCompanyId);
          carregarAdicionais(effectiveCompanyId);
          carregarIngredientesRemoviveis(effectiveCompanyId);
          carregarPontosCarne(effectiveCompanyId);
        }
      }, [isAuthenticated, abaAtiva, effectiveCompanyId]);

      useEffect(() => {
        if (isAuthenticated && abaAtiva === 'pedidos' && effectiveCompanyId && effectiveCompanyId !== 'foodstrick-master') {
          carregarPedidosOnline();
        }
      }, [isAuthenticated, abaAtiva, effectiveCompanyId]);

      // Pedidos Online: Supabase Auth + RLS, sem senha legada.
      async function carregarPedidosOnline() {
        if (!currentUser || !effectiveCompanyId || effectiveCompanyId === 'foodstrick-master') return;
        setPedidosLoading(true);
        setPedidosError('');
        try {
          const { data: sessionData, error: sessionError } = await supabaseClient.auth.getUser();
          if (sessionError || !sessionData?.user) throw new Error('Sua sessão expirou. Entre novamente no sistema.');
          const { data: orders, error: ordersError } = await supabaseClient
            .from('foodstrick_orders').select('*')
            .eq('company_id', effectiveCompanyId)
            .order('created_at', { ascending: false });
          if (ordersError) throw ordersError;
          const orderIds = (orders || []).map(order => order.id);
          let items = [];
          if (orderIds.length) {
            // A RLS da tabela de itens verifica a empresa do pedido associado.
            const { data: orderItems, error: itemsError } = await supabaseClient
              .from('foodstrick_order_items').select('*').in('order_id', orderIds);
            if (itemsError) throw itemsError;
            items = orderItems || [];
          }
          // Composição histórica: consulta restrita à empresa autenticada.
          let comboDetails = [];
          if (orderIds.length) {
            const { data: details, error: detailsError } = await supabaseClient.rpc(
              'foodstrick_order_combo_details', { p_order_ids: orderIds }
            );
            if (detailsError) {
              console.warn('Composição de combos indisponível:', detailsError);
            } else {
              comboDetails = Array.isArray(details) ? details : [];
            }
          }
          // Adicionais históricos de cada item (valores preservados no momento da compra).
          let addonDetails = [];
          if (orderIds.length) {
            const { data: details, error: addonError } = await supabaseClient.rpc(
              'foodstrick_order_addon_details', { p_order_ids: orderIds }
            );
            if (addonError) console.warn('Detalhes de adicionais indisponíveis:', addonError);
            else addonDetails = Array.isArray(details) ? details : [];
          }
          // Remoções históricas vinculadas ao item, nunca apenas às observações gerais.
          let removalDetails = [];
          if (orderIds.length) {
            const { data: details, error: removalError } = await supabaseClient.rpc(
              'foodstrick_order_removal_details', { p_order_ids: orderIds }
            );
            if (removalError) console.warn('Detalhes de remoções indisponíveis:', removalError);
            else removalDetails = Array.isArray(details) ? details : [];
          }
          const removalsByItem = new Map();
          for (const removal of removalDetails) {
            if (!removalsByItem.has(removal.order_item_id)) removalsByItem.set(removal.order_item_id, []);
            removalsByItem.get(removal.order_item_id).push(removal);
          }
          const addonsByItem = new Map();
          for (const addon of addonDetails) {
            if (!addonsByItem.has(addon.order_item_id)) addonsByItem.set(addon.order_item_id, []);
            addonsByItem.get(addon.order_item_id).push(addon);
          }
          const combosByOrder = new Map();
          for (const combo of comboDetails) {
            if (!combosByOrder.has(combo.order_id)) combosByOrder.set(combo.order_id, []);
            combosByOrder.get(combo.order_id).push(combo);
          }
          const itemsByOrder = new Map();
          for (const item of items) {
            if (!itemsByOrder.has(item.order_id)) itemsByOrder.set(item.order_id, []);
            itemsByOrder.get(item.order_id).push(item);
          }
          setPedidosOnline((orders || []).map(order => ({
            ...order, items: (itemsByOrder.get(order.id) || []).map(item => ({...item, addons: addonsByItem.get(item.id) || [], removals: removalsByItem.get(item.id) || []})), comboDetails: combosByOrder.get(order.id) || []
          })));
        } catch (error) {
          console.error('Erro ao carregar pedidos online:', error);
          setPedidosError(error.message || 'Não foi possível carregar os pedidos.');
          setPedidosOnline([]);
        } finally {
          setPedidosLoading(false);
        }
      }

      async function atualizarStatusPedido(pedidoId, novoStatus) {
        if (!currentUser || !effectiveCompanyId || effectiveCompanyId === 'foodstrick-master') return;
        const transicoes = { pending: ['accepted', 'rejected'], accepted: ['preparing'], preparing: ['ready'], ready: ['completed'] };
        const pedido = pedidosOnline.find(p => p.id === pedidoId);
        if (!pedido || !(transicoes[pedido.status] || []).includes(novoStatus)) {
          setPedidosError('Transição de status inválida. Atualize os pedidos e tente novamente.');
          return;
        }
        setPedidoAtualizando(pedidoId);
        setPedidosError('');
        try {
          const { data, error } = await supabaseClient.from('foodstrick_orders')
            .update({ status: novoStatus })
            .eq('id', pedidoId)
            .eq('company_id', effectiveCompanyId)
            .eq('status', pedido.status)
            .select('id,status');
          if (error) throw error;
          if (!data?.length) throw new Error('O pedido foi alterado ou você não tem permissão para atualizá-lo.');
          // IMPORTANTE: concluir o pedido NÃO confirma pagamento nem gera venda automaticamente.
          // A contabilização exige uma rotina transacional autorizada no servidor.
          await carregarPedidosOnline();
        } catch (error) {
          console.error('Erro ao atualizar pedido:', error);
          setPedidosError(error.message || 'Não foi possível atualizar o status do pedido.');
        } finally {
          setPedidoAtualizando(null);
        }
      }

      // Confirmação MANUAL: somente após verificar o recebimento real.
      // A RPC aplica autorização, isolamento por empresa e registro transacional.
      async function confirmarPagamentoManual(pedido) {
        if (!currentUser || !effectiveCompanyId || effectiveCompanyId === 'foodstrick-master') return;
        if (pedido.company_id !== effectiveCompanyId) return setPedidosError('Pedido não pertence a esta empresa.');
        if (pedido.payment_status === 'paid' || pedido.financial_launch_id) return;
        if (['rejected', 'cancelled', 'canceled', 'recusado', 'cancelado'].includes(String(pedido.status).toLowerCase())) return;
        const valor = Number(pedido.total || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        const confirmado = window.confirm(`Você conferiu que o restaurante RECEBEU ${valor} do pedido #${String(pedido.id).slice(0, 8).toUpperCase()}?\n\nSó confirme depois de verificar o dinheiro, a aprovação do cartão ou o Pix no extrato. Esta ação registra uma venda no financeiro.`);
        if (!confirmado) return;
        setPagamentoAtualizando(pedido.id);
        setPedidosError('');
        try {
          const { data, error } = await supabaseClient.rpc('foodstrick_confirm_manual_payment', { p_order_id: pedido.id });
          if (error) throw error;
          const resultado = Array.isArray(data) ? data[0] : data;
          await Promise.all([carregarPedidosOnline(), carregarTudoEmParalelo(effectiveCompanyId)]);
          alert(resultado?.already_recorded ? 'Pagamento já registrado anteriormente. Nenhuma venda duplicada foi criada.' : 'Pagamento confirmado e venda registrada em Lançamentos!');
        } catch (error) {
          console.error('Erro ao confirmar pagamento manual:', error);
          setPedidosError(error.message || 'Não foi possível confirmar o pagamento. Nenhuma confirmação foi assumida.');
        } finally {
          setPagamentoAtualizando(null);
        }
      }

      const statusPedidoLabel = status => ({ pending: 'Pendente', accepted: 'Aceito', preparing: 'Em preparo', ready: 'Pronto', completed: 'Concluído', rejected: 'Recusado', cancelled: 'Cancelado' }[status] || status || 'Pendente');
      const statusPedidoClass = status => ({ pending: 'bg-amber-950 text-amber-300 border-amber-900', accepted: 'bg-blue-950 text-blue-300 border-blue-900', preparing: 'bg-purple-950 text-purple-300 border-purple-900', ready: 'bg-emerald-950 text-emerald-300 border-emerald-900', completed: 'bg-zinc-800 text-zinc-300 border-zinc-700', rejected: 'bg-red-950 text-red-300 border-red-900', cancelled: 'bg-red-950 text-red-300 border-red-900' }[status] || 'bg-zinc-800 text-zinc-300 border-zinc-700');

      const navegarPara = (aba) => {
        setAbaAtiva(aba);
        setMobileMenuOpen(false);

      // ==========================
      // TELA DE LOGIN
      // ==========================

      if (!isAuthenticated || authScreen === 'reset' || authScreen === 'forgot') {
        return (

            <div className="absolute inset-0 bg-black/75 backdrop-blur-sm" />
            <div className="relative z-10 w-full max-w-sm bg-[#161616] rounded-2xl shadow-2xl border border-[#2d2d2d] p-6 sm:p-8 text-white">
              <div className="flex items-center gap-3 pb-5 border-b border-[#2d2d2d] mb-5">
                <div className="w-12 h-12 rounded-xl bg-[#D95B1E] flex items-center justify-center text-white shadow-lg shadow-[#D95B1E]/30 shrink-0">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
                </div>
                <div>
                  <h1 className="text-xl sm:text-2xl font-black italic tracking-wider text-white">FoodStrick</h1>
                  <p className="text-[10px] text-[#D95B1E] font-bold uppercase tracking-widest">SaaS Master Access</p>
                </div>
              </div>
              {authError && <div className="mb-4 p-3 bg-red-950/60 border border-red-800 text-red-300 rounded-lg text-xs font-medium text-center">{authError}</div>}
              {recoveryMessage && <div role="status" className="mb-4 p-3 bg-emerald-950/50 border border-emerald-800 text-emerald-300 rounded-lg text-xs leading-relaxed">{recoveryMessage}</div>}
              {authScreen === 'forgot' ? (
                <form onSubmit={handleRequestRecovery} className="space-y-4">
                  <h2 className="font-bold text-base">Recuperar senha</h2>
                  <p className="text-xs text-zinc-400">Informe seu e-mail para receber um link de recuperação.</p>
                  <div>
                    <label className="block text-xs font-medium text-zinc-400 mb-1">E-mail cadastrado</label>
                    <input type="email" autoComplete="email" placeholder="seu@email.com" value={recoveryEmail} onChange={e => setRecoveryEmail(e.target.value)} className="w-full bg-[#202020] text-white text-sm px-4 py-3 rounded-lg border border-[#333] focus:border-[#D95B1E] outline-none" required />
                  </div>
                  <button type="submit" disabled={recoveryBusy} className="w-full btn-orange font-bold py-3 rounded-lg text-sm disabled:opacity-60">{recoveryBusy ? 'Enviando...' : 'Enviar link de recuperação'}</button>
                  <button type="button" onClick={() => { setAuthScreen('login'); setAuthError(''); setRecoveryMessage(''); }} className="w-full text-sm text-zinc-400 hover:text-white py-2">Voltar ao login</button>
                </form>
              ) : authScreen === 'reset' ? (
                <form onSubmit={handleSaveNewPassword} className="space-y-4">
                  <h2 className="font-bold text-base">Definir nova senha</h2>
                  <p className="text-xs text-zinc-400">{recoveryReady ? 'Crie uma nova senha para sua conta.' : 'Validando link de recuperação... Se não validar, solicite outro link.'}</p>
                  <div>
                    <label className="block text-xs font-medium text-zinc-400 mb-1">Nova senha</label>
                    <input type="password" autoComplete="new-password" minLength="8" value={newPassword} onChange={e => setNewPassword(e.target.value)} className="w-full bg-[#202020] text-white text-sm px-4 py-3 rounded-lg border border-[#333] focus:border-[#D95B1E] outline-none" required />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-zinc-400 mb-1">Confirmar nova senha</label>
                    <input type="password" autoComplete="new-password" minLength="8" value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} className="w-full bg-[#202020] text-white text-sm px-4 py-3 rounded-lg border border-[#333] focus:border-[#D95B1E] outline-none" required />
                  </div>
                  <button type="submit" disabled={recoveryBusy || !recoveryReady} className="w-full btn-orange font-bold py-3 rounded-lg text-sm disabled:opacity-60">{recoveryBusy ? 'Salvando...' : 'Salvar nova senha'}</button>
                  <button type="button" onClick={() => { setAuthScreen('forgot'); setAuthError(''); setRecoveryMessage(''); }} className="w-full text-sm text-zinc-400 hover:text-white py-2">Solicitar outro link</button>
                </form>
              ) : <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-medium text-zinc-400 mb-1">E-mail</label>
                  <input type="email" autoComplete="email" placeholder="seu@email.com" value={username} onChange={(e) => setUsername(e.target.value)} className="w-full bg-[#202020] text-white text-base md:text-sm px-4 py-3 md:py-2.5 rounded-lg border border-[#333] focus:border-[#D95B1E] outline-none" required />
                </div>
                <div className="relative">
                  <label className="block text-xs font-medium text-zinc-400 mb-1">Senha</label>
                  <input type={showPassword ? "text" : "password"} placeholder="••••••••" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full bg-[#202020] text-white text-base md:text-sm px-4 py-3 md:py-2.5 pr-10 rounded-lg border border-[#333] focus:border-[#D95B1E] outline-none" required />
                  <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-3 top-8 md:top-8 text-zinc-400 hover:text-white p-1">
                    {showPassword ? (
                      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                    ) : (
                      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    )}
                  </button>
                </div>
                <button type="submit" className="w-full btn-orange font-bold py-3.5 md:py-3 rounded-lg text-sm tracking-wide shadow-lg transition-all mt-2 active:scale-95">Acessar Sistema</button>
                <button type="button" onClick={() => { setRecoveryEmail(username); setAuthScreen('forgot'); setAuthError(''); setRecoveryMessage(''); }} className="w-full text-center text-xs text-[#f28a54] hover:text-white py-2">Esqueci minha senha</button>
              </form>}
            </div>
          </div>
        );
      }

      // SISTEMA PRINCIPAL
      return (
        <div className="flex flex-col md:flex-row min-h-screen relative">
          {coverEditorSource && <CoverCropEditor imageSrc={coverEditorSource} onCancel={() => setCoverEditorSource(null)} onApply={result => { setMenuSettings(v => ({...v,menu_cover_image:result})); setCoverEditorSource(null); }} />}
          
          {/* HEADER MOBILE */}
          <header className="md:hidden sticky top-0 z-40 bg-[#141414] border-b border-[#242424] px-4 py-3 flex items-center justify-between">
            <div className="flex items-center gap-2.5">
              <div className="w-8 h-8 rounded-lg bg-[#D95B1E] flex items-center justify-center text-white shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
              </div>
              <div className="overflow-hidden">
                <span className="text-sm font-black text-white block leading-tight">FoodStrick</span>
                <span className="text-[10px] text-zinc-400 font-semibold uppercase tracking-wider block truncate max-w-[170px]">{effectiveCompanyName}</span>
              </div>
            </div>

            <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="p-2 text-zinc-300 hover:text-white bg-[#202020] border border-[#333] rounded-lg transition-colors" title="Menu">
              {mobileMenuOpen ? (
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
              ) : (
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
              )}
            </button>
          </header>

          {/* GAVETA MOBILE */}
          {mobileMenuOpen && (
            <div className="md:hidden fixed inset-0 z-30 bg-black/80 backdrop-blur-sm pt-16 flex flex-col justify-between p-5 animate-in fade-in duration-150">
              <nav className="space-y-2 mt-2">
                {(!isSuperAdmin || impersonatedCompany) && (
                  <>
                    <button onClick={() => navegarPara('painel')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition-all ${abaAtiva === 'painel' ? 'btn-orange shadow-md' : 'text-zinc-300 bg-[#1a1a1a]'}`}>
                      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
                      Painel Geral
                    </button>
                    <button onClick={() => navegarPara('lancamentos')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition-all ${abaAtiva === 'lancamentos' ? 'btn-orange shadow-md' : 'text-zinc-300 bg-[#1a1a1a]'}`}>
                      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17V7"/></svg>
                      Lançamentos
                    </button>
                    <button onClick={() => navegarPara('produtos')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition-all ${abaAtiva === 'produtos' ? 'btn-orange shadow-md' : 'text-zinc-300 bg-[#1a1a1a]'}`}>
                      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
                      Produtos & Custos
                    </button>
                    <button onClick={() => navegarPara('fichas')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition-all ${abaAtiva === 'fichas' ? 'btn-orange shadow-md' : 'text-zinc-300 bg-[#1a1a1a]'}`}>
                      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M9 12h6"/><path d="M9 16h6"/></svg>

                          <th className="pb-2.5 uppercase text-right">Valor</th>
                          <th className="pb-2.5 uppercase text-center"></th>

                      </thead>
                      <tbody className="divide-y divide-[#262626]">

                          <tr key={l.id} className="hover:bg-[#1c1c1c] group">
                            <td className="py-2.5">{l.data}</td>
                            <td className="py-2.5"><span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${l.tipo === 'Venda' ? 'bg-emerald-950/60 text-emerald-400' : 'bg-red-950/60 text-red-400'}`}>{l.tipo}</span></td>
                            <td className="py-2.5 text-white font-medium">{l.descricao}{l.fornecedor && <span className="text-[10px] text-zinc-500 block">Forn: {l.fornecedor}</span>}</td>

                              <button onClick={() => setModalExclusao({ aberto: true, idLancamento: l.id })} className="p-1.5 text-zinc-500 hover:text-red-400 rounded">
                                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* 3. ABA PRODUTOS & CARDÁPIO */}
            {abaAtiva === 'produtos' && (!isSuperAdmin || impersonatedCompany) && (
              <div className="max-w-6xl">
                <header className="mb-5"><h1 className="text-xl sm:text-2xl font-bold text-white">Produtos & Cardápio</h1></header>
                <form onSubmit={handleSalvarProduto} className="bg-[#161616] border border-[#262626] p-4 sm:p-6 rounded-xl mb-6 space-y-3">
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                    <div>
                      <label className="block text-[11px] font-medium text-zinc-400 mb-1">Nome do Item</label>
                      <input type="text" value={novoProduto.nome} onChange={e => setNovoProduto({...novoProduto, nome: e.target.value})} className="w-full bg-[#202020] border border-[#333] rounded-lg p-2.5 text-base md:text-xs text-white outline-none" required />
                    </div>
                    <div>
                      <label className="block text-[11px] font-medium text-zinc-400 mb-1">Preço Venda (R$)</label>
                      <input type="text" value={novoProduto.preco_venda} onChange={e => setNovoProduto({...novoProduto, preco_venda: e.target.value})} className="w-full bg-[#202020] border border-[#333] rounded-lg p-2.5 text-base md:text-xs text-white outline-none" required />
                    </div>
                    <div>
                      <label className="block text-[11px] font-medium text-zinc-400 mb-1">Custo Insumo (R$)</label>
                      <input type="text" value={novoProduto.custo_unitario} onChange={e => setNovoProduto({...novoProduto, custo_unitario: e.target.value})} className="w-full bg-[#202020] border border-[#333] rounded-lg p-2.5 text-base md:text-xs text-white outline-none" required />
                    </div>
                    <div className="flex items-end">
                      <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 md:py-2.5 rounded-lg text-xs shadow-md">Guardar Produto</button>
                    </div>
                  </div>
                </form>

                <div className="bg-[#161616] border border-[#262626] rounded-xl p-4 sm:p-5 overflow-hidden shadow-sm">
                  <h2 className="text-xs sm:text-sm font-bold text-white mb-3">Itens Registados ({produtos.length})</h2>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs text-zinc-400 min-w-[580px]">
                      <thead className="border-b border-[#262626]">
                        <tr>
                          <th className="pb-2.5 uppercase">Item</th>
                          <th className="pb-2.5 uppercase">Preço Venda</th>
                          <th className="pb-2.5 uppercase">Custo</th>
                          <th className="pb-2.5 uppercase">Margem Bruta</th>
                          <th className="pb-2.5 uppercase">Margem (%)</th>
                          <th className="pb-2.5 uppercase text-right pr-2">Ações</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#262626]">
                        {produtos.map(p => {
                          const margem = Number(p.preco_venda) - Number(p.custo_unitario);
                          const pct = p.preco_venda > 0 ? ((margem / p.preco_venda) * 100).toFixed(1) : 0;
                          const totalIng = Array.isArray(p.ingredientes) ? p.ingredientes.length : 0;
                          return (
                            <tr key={p.id} className="hover:bg-[#1c1c1c]">
                              <td className="py-2.5 text-white font-medium">
                                {p.nome}
                                {totalIng > 0 && (
                                  <span className="ml-1.5 px-1.5 py-0.5 rounded text-[9px] font-semibold bg-emerald-950/80 text-emerald-400 border border-emerald-900/60">
                                    {totalIng} insumos
                                  </span>
                                )}
                              </td>
                              <td className="py-2.5 text-white font-mono">R$ {Number(p.preco_venda).toFixed(2)}</td>
                              <td className="py-2.5 font-mono">R$ {Number(p.custo_unitario).toFixed(2)}</td>
                              <td className="py-2.5 font-bold text-emerald-400 font-mono">R$ {margem.toFixed(2)}</td>
                              <td className="py-2.5 text-zinc-300 font-mono">{pct}%</td>
                              <td className="py-2.5 text-right pr-2">
                                <div className="flex items-center justify-end gap-1.5">
                                  {/* BOTÃO 1: FICHA TÉCNICA (PRANCHETA) */}
                                  <button 
                                    onClick={() => setModalFichaTecnica({ aberto: true, produto: p })} 
                                    className="p-1.5 text-zinc-400 hover:text-emerald-400 hover:bg-emerald-500/10 rounded transition-colors cursor-pointer" 
                                    title="Abrir Ficha Técnica e Insumos"
                                  >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M9 12h6"/><path d="M9 16h6"/></svg>
                                  </button>

                                  {/* BOTÃO 2: EDITAR PREÇOS (LÁPIS) */}
                                  <button 
                                    onClick={() => setModalEditarProduto({ aberto: true, id: p.id, nome: p.nome, preco_venda: p.preco_venda, custo_unitario: p.custo_unitario, observacao: p.observacao || '' })} 
                                    className="p-1.5 text-zinc-400 hover:text-amber-400 hover:bg-amber-500/10 rounded transition-colors cursor-pointer" 
                                    title="Editar Nome e Preços"
                                  >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
                                  </button>

                                  {/* BOTÃO 3: ELIMINAR (LIXEIRA) */}
                                  <button 
                                    onClick={() => setModalExcluirProduto({ aberto: true, idProduto: p.id, nome: p.nome })} 
                                    className="p-1.5 text-zinc-400 hover:text-red-400 hover:bg-red-500/10 rounded transition-colors cursor-pointer" 
                                    title="Eliminar Produto"
                                  >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                                  </button>
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* ABA CARDÁPIO ONLINE */}
            {abaAtiva === 'cozinha' && (!isSuperAdmin || impersonatedCompany) && (
              <div className="max-w-6xl space-y-4"><div className="flex flex-wrap justify-between items-center gap-3"><div><h1 className="text-xl sm:text-2xl font-bold text-white">Painel de Cozinha</h1><p className="text-xs text-zinc-400 mt-1">Acesso próprio da equipe da cozinha. Pedidos sincronizados com Pedidos Online.</p></div><a href="/cozinha.html" target="_blank" rel="noopener noreferrer" className="bg-[#D95B1E] rounded-lg px-4 py-2.5 text-xs font-bold text-white">Abrir tela exclusiva ↗</a></div><iframe title="FoodStrick KDS" src="/cozinha.html" className="w-full min-h-[78vh] rounded-xl border border-[#303034] bg-[#101010]" /></div>
            )}
            {abaAtiva === 'pedidos' && (!isSuperAdmin || impersonatedCompany) && (
              <div className="max-w-6xl">
                <header className="mb-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                  <div><h1 className="text-xl sm:text-2xl font-bold text-white">Pedidos Online</h1><p className="text-xs text-zinc-400 mt-1">Pedidos enviados pelos clientes no cardápio público desta unidade.</p></div>
                  <button onClick={carregarPedidosOnline} disabled={pedidosLoading} className="inline-flex items-center justify-center gap-2 rounded-lg bg-[#252525] hover:bg-[#333] border border-[#3a3a3a] px-4 py-2.5 text-sm font-semibold text-white disabled:opacity-50"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={pedidosLoading?'animate-spin':''}><path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 11.6-2L20 12M4 12l2.8 5a7 7 0 0 0 11.6-2"/></svg>{pedidosLoading?'Atualizando...':'Atualizar pedidos'}</button>
                </header>
                {pedidosError && <div className="mb-4 rounded-xl border border-red-900 bg-red-950/50 p-3 text-sm text-red-300">{pedidosError}</div>}
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
                  <div className="rounded-xl border border-[#2b2b2b] bg-[#161616] p-4"><p className="text-xs text-zinc-400">Total de pedidos</p><p className="text-2xl font-black text-white mt-1">{pedidosOnline.length}</p></div>
                  <div className="rounded-xl border border-amber-900/60 bg-[#161616] p-4"><p className="text-xs text-zinc-400">Pendentes</p><p className="text-2xl font-black text-amber-300 mt-1">{pedidosOnline.filter(p=>p.status==='pending').length}</p></div>
                  <div className="rounded-xl border border-purple-900/60 bg-[#161616] p-4"><p className="text-xs text-zinc-400">Em preparo</p><p className="text-2xl font-black text-purple-300 mt-1">{pedidosOnline.filter(p=>p.status==='preparing').length}</p></div>
                  <div className="rounded-xl border border-emerald-900/60 bg-[#161616] p-4"><p className="text-xs text-zinc-400">Concluídos</p><p className="text-2xl font-black text-emerald-300 mt-1">{pedidosOnline.filter(p=>p.status==='completed').length}</p></div>
                </div>
                <div className="flex gap-2 overflow-x-auto pb-3 mb-2">
                  {[['todos','Todos'],['pending','Pendentes'],['accepted','Aceitos'],['preparing','Em preparo'],['ready','Prontos'],['completed','Concluídos'],['rejected','Recusados'],['cancelled','Cancelados']].map(([value,label])=><button key={value} onClick={()=>setFiltroPedidos(value)} className={`whitespace-nowrap rounded-lg px-3 py-2 text-xs font-bold border ${filtroPedidos===value?'bg-[#D95B1E] border-[#D95B1E] text-white':'bg-[#191919] border-[#333] text-zinc-400 hover:text-white'}`}>{label}</button>)}
                </div>
                {pedidosLoading && pedidosOnline.length===0 ? <div className="rounded-xl border border-[#262626] bg-[#161616] p-10 text-center text-zinc-400">Carregando pedidos...</div> : (pedidosOnline.filter(p=>filtroPedidos==='todos'||p.status===filtroPedidos).length===0 ? <div className="rounded-xl border border-dashed border-[#333] bg-[#161616] p-10 text-center"><div className="text-zinc-500 mb-2"><svg className="mx-auto" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M6 2h12v20l-2-1-2 1-2-1-2 1-2-1-2 1V2Z"/><path d="M9 8h6M9 12h6"/></svg></div><h2 className="font-bold text-white">Nenhum pedido nesta categoria</h2><p className="text-sm text-zinc-500 mt-1">Quando um cliente enviar um pedido pelo cardápio público, ele aparecerá aqui.</p></div> : <div className="space-y-3">{pedidosOnline.filter(p=>filtroPedidos==='todos'||p.status===filtroPedidos).map(p=>{
                  const expanded=pedidoExpandido===p.id;
                  const created=p.created_at?new Date(p.created_at).toLocaleString('pt-BR'):'Data indisponível';
                  const detalhesPorNome = new Map();
                  for (const combo of (p.comboDetails || [])) {
                    const nome = String(combo.combo_name || '').trim().toLocaleLowerCase('pt-BR');
                    if (!detalhesPorNome.has(nome)) detalhesPorNome.set(nome, []);
                    detalhesPorNome.get(nome).push(combo);
                  }
                  return <article key={p.id} className="rounded-xl border border-[#2b2b2b] bg-[#161616] overflow-hidden">
                    <div className="p-4 sm:p-5"><div className="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3"><div className="min-w-0"><div className="flex flex-wrap items-center gap-2"><h2 className="font-bold text-white">Pedido #{String(p.id).slice(0,8).toUpperCase()}</h2><span className={`rounded-full border px-2 py-1 text-[10px] font-bold ${statusPedidoClass(p.status)}`}>{statusPedidoLabel(p.status)}</span></div><p className="text-xs text-zinc-500 mt-1">{created}</p><p className="text-sm text-zinc-200 mt-3 font-semibold">{p.customer_name}</p><p className="text-xs text-zinc-400 mt-1">{p.customer_phone}</p></div><div className="sm:text-right"><p className="text-xl font-black text-[#F28B50]">R$ {Number(p.total||0).toFixed(2).replace('.',',')}</p><p className="text-xs text-zinc-400 mt-1">{p.order_type==='delivery'?'Entrega':'Retirada'} · {p.payment_method||'Pagamento não informado'}</p></div></div>
                    {p.order_type==='delivery'&&p.delivery_address&&<p className="text-xs text-zinc-400 mt-3">Endereço: {p.delivery_address}</p>}{p.notes&&<p className="text-xs text-zinc-400 mt-2">Observações: {p.notes}</p>}
                    <div className="flex flex-wrap items-center gap-2 mt-4"><button onClick={()=>setPedidoExpandido(expanded?null:p.id)} className="rounded-lg border border-[#3a3a3a] bg-[#242424] px-3 py-2 text-xs font-bold text-white">{expanded?'Ocultar itens':'Ver itens'} ({(p.items||[]).length})</button><span className={`rounded-lg border px-3 py-2 text-xs font-bold ${p.payment_status==='paid'?'border-emerald-800 bg-emerald-950 text-emerald-300':'border-amber-900 bg-amber-950/40 text-amber-300'}`}>{p.payment_status==='paid'?'Pagamento recebido':'Pagamento pendente'}</span>{p.payment_status!=='paid'&&!p.financial_launch_id&&!['rejected','cancelled','canceled','recusado','cancelado'].includes(String(p.status).toLowerCase())&&<button type="button" disabled={pagamentoAtualizando===p.id||pedidoAtualizando===p.id} onClick={()=>confirmarPagamentoManual(p)} className="rounded-lg bg-[#D95B1E] hover:bg-[#c34e17] px-3 py-2 text-xs font-bold text-white disabled:opacity-50">{pagamentoAtualizando===p.id?'Confirmando...':'Confirmar recebimento'}</button>}{p.status==='pending'&&<><button disabled={pedidoAtualizando===p.id} onClick={()=>atualizarStatusPedido(p.id,'accepted')} className="rounded-lg bg-emerald-700 hover:bg-emerald-600 px-3 py-2 text-xs font-bold text-white disabled:opacity-50">Aceitar pedido</button><button disabled={pedidoAtualizando===p.id} onClick={()=>atualizarStatusPedido(p.id,'rejected')} className="rounded-lg bg-red-950 hover:bg-red-900 border border-red-900 px-3 py-2 text-xs font-bold text-red-300 disabled:opacity-50">Recusar</button></>}{p.status==='accepted'&&<button disabled={pedidoAtualizando===p.id} onClick={()=>atualizarStatusPedido(p.id,'preparing')} className="rounded-lg bg-purple-800 hover:bg-purple-700 px-3 py-2 text-xs font-bold text-white disabled:opacity-50">Iniciar preparo</button>}{p.status==='preparing'&&<button disabled={pedidoAtualizando===p.id} onClick={()=>atualizarStatusPedido(p.id,'ready')} className="rounded-lg bg-blue-800 hover:bg-blue-700 px-3 py-2 text-xs font-bold text-white disabled:opacity-50">Marcar como pronto</button>}{p.status==='ready'&&<button disabled={pedidoAtualizando===p.id} onClick={()=>atualizarStatusPedido(p.id,'completed')} className="rounded-lg bg-emerald-700 hover:bg-emerald-600 px-3 py-2 text-xs font-bold text-white disabled:opacity-50">Concluir pedido</button>}</div>
                    {expanded&&<div className="mt-4 rounded-lg border border-[#2b2b2b] bg-[#1c1c1c] p-3">{!(p.items||[]).length?<p className="text-xs text-zinc-500">Itens não retornados pelo banco.</p>:<div className="space-y-2">{p.items.map((it,i)=><div key={it.id||i} className="flex justify-between gap-3 text-sm"><div className="min-w-0"><span className="text-zinc-300">{it.quantity} × {it.product_name}</span>{(it.addons || []).length > 0 && <div className="mt-2 rounded-lg border border-[#543c2b] bg-[#29201a] px-3 py-2"><p className="text-xs font-semibold text-[#F28B50] mb-1">Adicionais para preparar</p>{it.addons.map((extra,ei)=><p key={ei} className="text-xs text-zinc-300">+ {extra.quantity} × {extra.addon_name} — R$ {Number(extra.line_total||0).toFixed(2).replace('.',',')}</p>)}</div>}{(it.removals || []).length > 0 && <div className="mt-2 rounded-lg border border-amber-800/60 bg-amber-950/20 px-3 py-2"><p className="text-xs font-bold text-amber-300 mb-1">RETIRAR DO LANCHE</p>{it.removals.map((r,ri)=><p key={ri} className="text-xs font-bold text-amber-200">SEM {String(r.ingredient_name || '').toUpperCase()}</p>)}</div>}{String(it.product_name || '').startsWith('Combo: ') && (() => {
                      const nome = String(it.product_name).slice(7).trim().toLocaleLowerCase('pt-BR');
                      const encontrados = detalhesPorNome.get(nome) || [];
                      const ocorrenciasAnteriores = (p.items || []).slice(0, i).filter(anterior => String(anterior.product_name || '').trim().toLocaleLowerCase('pt-BR') === String(it.product_name || '').trim().toLocaleLowerCase('pt-BR')).length;
                      const detalhe = encontrados[ocorrenciasAnteriores];
                      if (!detalhe) return null;
                      return <div className="mt-2 rounded-lg border border-[#383838] bg-[#242424] px-3 py-2"><p className="text-xs font-semibold text-[#F28B50] mb-1">Composição para preparar</p>{(detalhe.components || []).map((componente, ci) => <p key={ci} className="text-xs text-zinc-300">{Number(componente.quantity_per_combo || 0) * Number(it.quantity || 0)} × {componente.product_name}</p>)}</div>;
                    })()}</div><span className="text-white font-semibold">R$ {Number(it.line_total||0).toFixed(2).replace('.',',')}</span></div>)}<div className="border-t border-[#333] pt-2 flex justify-between font-black"><span>Total</span><span className="text-[#F28B50]">R$ {Number(p.total||0).toFixed(2).replace('.',',')}</span></div></div>}</div>}
                    </div></article>;
                })}</div>)}
              </div>
            )}

            {abaAtiva === 'cardapio' && (!isSuperAdmin || impersonatedCompany) && (
              <div className="max-w-6xl space-y-6">
                <header className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                  <div><h1 className="text-xl sm:text-2xl font-bold text-white">Cardápio Online</h1><p className="text-xs text-zinc-400 mt-1">Gerencie o que seus clientes veem no cardápio público.</p></div>
                  <a href={`/loja/${encodeURIComponent(menuSettings.menu_slug || (effectiveCompanyId === 'cozinha-brasileira' ? 'foodstrick' : effectiveCompanyId || ''))}`} target="_blank" rel="noreferrer" className="inline-flex justify-center items-center rounded-lg bg-[#D95B1E] hover:bg-[#c34e17] px-4 py-2.5 text-xs font-bold text-white">Visualizar cardápio ↗</a>
                </header>

                {/* ADICIONAIS - cadastro e associação aos produtos existentes */}
                <section className="bg-[#161616] border border-[#D95B1E]/30 rounded-xl p-4 sm:p-6 space-y-5">
                  <div className="flex flex-wrap justify-between items-center gap-3">
                    <div><h2 className="text-lg font-bold text-white">Adicionais dos produtos</h2><p className="text-xs text-zinc-400 mt-1">Cadastre extras, seus preços e o limite por pedido de cada produto.</p></div>

                        <div className="grid grid-cols-2 gap-3">
                          <label className="block text-xs text-zinc-300">Preço (R$)<input required type="number" min="0" step="0.01" value={addonForm.price} onChange={e=>setAddonForm(v=>({...v,price:e.target.value}))} className="mt-1 w-full bg-[#252525] border border-[#444] rounded-lg p-3 text-sm text-white"/></label>
                          <label className="block text-xs text-zinc-300">Máximo por item<input required type="number" min="1" max="20" step="1" value={addonForm.max_quantity} onChange={e=>setAddonForm(v=>({...v,max_quantity:e.target.value}))} className="mt-1 w-full bg-[#252525] border border-[#444] rounded-lg p-3 text-sm text-white"/></label>
                        </div>
                        <label className="flex items-center gap-2 text-xs text-zinc-300"><input type="checkbox" checked={addonForm.active} onChange={e=>setAddonForm(v=>({...v,active:e.target.checked}))} className="accent-orange-600"/> Disponível para clientes</label>
                        <div className="flex gap-2"><button disabled={addonsBusy} className="rounded-lg bg-[#D95B1E] px-4 py-2.5 text-xs font-bold text-white disabled:opacity-50">{addonsBusy?'Salvando...':addonForm.id?'Salvar alterações':'+ Cadastrar adicional'}</button>{addonForm.id&&<button type="button" onClick={()=>setAddonForm({id:null,name:'',price:'',max_quantity:1,active:true})} className="rounded-lg border border-[#444] px-3 py-2 text-xs text-zinc-300">Cancelar</button>}</div>
                      </form>
                      <div className="space-y-2 max-h-80 overflow-y-auto">
                        {addonsLoading?<p className="text-xs text-zinc-400">Carregando...</p>:!addons.length?<p className="text-xs text-zinc-500">Nenhum adicional cadastrado.</p>:addons.map(a=><div key={a.id} className="rounded-lg border border-[#333] bg-[#202020] p-3 flex items-center justify-between gap-2"><div className="min-w-0"><p className="text-sm font-semibold text-white break-words">{a.name} {!a.active&&<span className="text-[10px] text-zinc-500">(Inativo)</span>}</p><p className="text-xs text-[#F28B50] mt-1">R$ {Number(a.price).toFixed(2).replace('.',',')} · até {a.max_quantity} un.</p></div><div className="flex gap-1 shrink-0"><button type="button" onClick={()=>setAddonForm({id:a.id,name:a.name,price:String(a.price),max_quantity:a.max_quantity,active:a.active})} className="rounded-md bg-[#333] px-2 py-1.5 text-xs text-white">Editar</button><button type="button" disabled={addonsBusy} onClick={()=>excluirAdicional(a)} className="rounded-md border border-red-900 px-2 py-1.5 text-xs text-red-300">Excluir</button></div></div>)}
                      </div>
                    </div>
                    <form onSubmit={salvarVinculosAdicionais} className="rounded-xl border border-[#333] bg-[#1d1d1d] p-4 space-y-3 h-fit">
                      <h3 className="text-sm font-bold text-white">Quais adicionais aparecem em cada produto?</h3>
                      <p className="text-xs text-zinc-400">Selecione um produto e marque os extras disponíveis para ele. Produtos sem extras não exibirão a pergunta no cardápio.</p>
                      <select value={addonProductId} onChange={e=>selecionarProdutoAdicionais(e.target.value)} className="w-full bg-[#252525] border border-[#444] rounded-lg p-3 text-sm text-white"><option value="">Selecione um produto</option>{produtos.map(p=><option key={p.id} value={p.id}>{p.nome}</option>)}</select>
                      {addonProductId&&<><div className="space-y-2 max-h-72 overflow-y-auto">{!addons.length?<p className="text-xs text-zinc-500">Cadastre adicionais primeiro.</p>:addons.map(a=><label key={a.id} className="flex items-center justify-between gap-3 rounded-lg border border-[#333] bg-[#252525] p-3 cursor-pointer"><span className="flex items-center gap-2 text-sm text-zinc-200"><input type="checkbox" checked={addonProductSelection.includes(a.id)} onChange={e=>setAddonProductSelection(prev=>e.target.checked?[...prev,a.id]:prev.filter(id=>id!==a.id))} className="accent-orange-600"/>{a.name}</span><span className="text-xs text-[#F28B50] whitespace-nowrap">R$ {Number(a.price).toFixed(2).replace('.',',')}</span></label>)}</div><button disabled={addonsBusy||addonsLoading} className="w-full rounded-lg bg-[#D95B1E] px-4 py-2.5 text-xs font-bold text-white disabled:opacity-50">Salvar adicionais deste produto</button></>}
                    </form>
                  </div>
                </section>

                {/* INGREDIENTES REMOVÍVEIS — cadastro e associação, sem alterar adicionais pagos */}
