                  {removableError && <p role="alert" className="rounded-lg border border-red-900 bg-red-950/40 p-3 text-xs text-red-300">{removableError}</p>}
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                    <div className="space-y-3">
                      <form onSubmit={salvarIngredienteRemovivel} className="space-y-3 rounded-xl border border-[#333] bg-[#1d1d1d] p-4">
                        <h3 className="text-sm font-bold text-white">{removableForm.id?'Editar ingrediente':'Novo ingrediente removível'}</h3>
                        <label className="block text-xs text-zinc-300">Nome do ingrediente<input required maxLength={120} value={removableForm.name} onChange={e=>setRemovableForm(v=>({...v,name:e.target.value}))} placeholder="Ex.: Cebola, tomate, molho especial" className="mt-1 w-full bg-[#252525] border border-[#444] rounded-lg p-3 text-sm text-white"/></label>
                        <label className="flex items-center gap-2 text-xs text-zinc-300"><input type="checkbox" checked={removableForm.active} onChange={e=>setRemovableForm(v=>({...v,active:e.target.checked}))} className="accent-orange-600"/> Disponível para remoção no cardápio</label>
                        <div className="flex gap-2"><button disabled={removableBusy} className="rounded-lg bg-[#D95B1E] px-4 py-2.5 text-xs font-bold text-white disabled:opacity-50">{removableBusy?'Salvando...':removableForm.id?'Salvar alterações':'+ Cadastrar ingrediente'}</button>{removableForm.id&&<button type="button" onClick={()=>setRemovableForm({id:null,name:'',active:true})} className="rounded-lg border border-[#444] px-3 py-2 text-xs text-zinc-300">Cancelar</button>}</div>
                      </form>
                      <div className="space-y-2 max-h-80 overflow-y-auto">
                        {removableLoading?<p className="text-xs text-zinc-400">Carregando...</p>:!removableIngredients.length?<p className="text-xs text-zinc-500">Nenhum ingrediente cadastrado.</p>:removableIngredients.map(item=><div key={item.id} className="rounded-lg border border-[#333] bg-[#202020] p-3 flex items-center justify-between gap-2"><div className="min-w-0"><p className="text-sm font-semibold text-white break-words">{item.name} {!item.active&&<span className="text-[10px] text-zinc-500">(Inativo)</span>}</p><p className="text-xs text-zinc-400 mt-1">Remoção gratuita</p></div><div className="flex gap-1 shrink-0"><button type="button" onClick={()=>setRemovableForm({id:item.id,name:item.name,active:item.active})} className="rounded-md bg-[#333] px-2 py-1.5 text-xs text-white">Editar</button><button type="button" disabled={removableBusy} onClick={()=>excluirIngredienteRemovivel(item)} className="rounded-md border border-red-900 px-2 py-1.5 text-xs text-red-300">Excluir</button></div></div>)}
                      </div>
                    </div>
                    <form onSubmit={salvarVinculosIngredientes} className="rounded-xl border border-[#333] bg-[#1d1d1d] p-4 space-y-3 h-fit">
                      <h3 className="text-sm font-bold text-white">Quais ingredientes podem ser retirados de cada produto?</h3>
                      <p className="text-xs text-zinc-400">Marque somente ingredientes que realmente fazem parte do produto. Se não marcar nenhum, a opção de remoção não aparecerá.</p>
                      <select value={removableProductId} onChange={e=>selecionarProdutoIngredientes(e.target.value)} className="w-full bg-[#252525] border border-[#444] rounded-lg p-3 text-sm text-white"><option value="">Selecione um produto</option>{produtos.map(p=><option key={p.id} value={p.id}>{p.nome}</option>)}</select>
                      {removableProductId&&<><div className="space-y-2 max-h-72 overflow-y-auto">{!removableIngredients.length?<p className="text-xs text-zinc-500">Cadastre ingredientes primeiro.</p>:removableIngredients.map(item=><label key={item.id} className="flex items-center justify-between gap-3 rounded-lg border border-[#333] bg-[#252525] p-3 cursor-pointer"><span className="flex items-center gap-2 text-sm text-zinc-200"><input type="checkbox" checked={removableSelection.includes(item.id)} onChange={e=>setRemovableSelection(prev=>e.target.checked?[...prev,item.id]:prev.filter(id=>id!==item.id))} className="accent-orange-600"/>{item.name}</span><span className="text-xs text-zinc-400 whitespace-nowrap">Grátis</span></label>)}</div><button disabled={removableBusy||removableLoading} className="w-full rounded-lg bg-[#D95B1E] px-4 py-2.5 text-xs font-bold text-white disabled:opacity-50">Salvar ingredientes deste produto</button></>}
                    </form>
                  </div>
                </section>

                {/* PONTO DA CARNE — configuração opcional por produto */}
                <section className="bg-[#161616] border border-[#D95B1E]/30 rounded-xl p-4 sm:p-6 space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-3">
                    <div><h2 className="text-lg font-bold text-white">Ponto da carne</h2><p className="text-xs text-zinc-400 mt-1">Configure quais pontos cada produto oferece. A escolha não altera o preço.</p></div>
                    <button type="button" onClick={()=>carregarPontosCarne()} className="rounded-lg border border-[#444] px-3 py-2 text-xs text-white">Atualizar</button>
                  </div>
                  {meatError&&<p role="alert" className="text-xs text-red-300">{meatError}</p>}
                  <form onSubmit={salvarPontoCarne} className="space-y-4 max-w-2xl">
                    <label className="block text-xs text-zinc-300">Produto
                      <select value={meatProductId} onChange={e=>selecionarProdutoPontoCarne(e.target.value)} className="mt-2 w-full rounded-lg border border-[#444] bg-[#252525] p-3 text-sm text-white"><option value="">Selecione um produto</option>{produtos.map(p=><option key={p.id} value={p.id}>{p.nome}</option>)}</select>
                    </label>
                    {meatProductId&&<>
                      <label className="flex items-center gap-2 text-sm text-zinc-200"><input type="checkbox" checked={meatEnabled} onChange={e=>setMeatEnabled(e.target.checked)} className="accent-orange-600"/> Permitir escolha do ponto neste produto</label>
                      {meatEnabled&&<>
                        <div className="space-y-2"><p className="text-xs font-bold text-white">Pontos disponíveis</p>
                          {['Mal passada','Ao ponto','Bem passada'].map(point=><label key={point} className="flex items-center gap-2 rounded-lg border border-[#333] bg-[#252525] p-3 text-sm text-zinc-200"><input type="checkbox" className="accent-orange-600" checked={meatOptions.includes(point)} onChange={e=>{const next=e.target.checked?[...meatOptions,point]:meatOptions.filter(p=>p!==point);setMeatOptions(next);if(!next.includes(meatDefault))setMeatDefault(next[0]||'');}}/>{point}</label>)}
                        </div>
                        <label className="block text-xs text-zinc-300">Ponto padrão<select value={meatDefault} onChange={e=>setMeatDefault(e.target.value)} className="mt-2 w-full rounded-lg border border-[#444] bg-[#252525] p-3 text-sm text-white">{meatOptions.map(point=><option key={point} value={point}>{point}</option>)}</select></label>
                        <p className="text-xs text-amber-300">Atenção: carne moída mal passada pode oferecer riscos à saúde. Ofereça apenas preparos que atendam às normas sanitárias.</p>
                      </>}
                      <button disabled={meatBusy} className="rounded-lg bg-[#D95B1E] px-4 py-2.5 text-xs font-bold text-white disabled:opacity-50">{meatBusy?'Salvando...':'Salvar pontos deste produto'}</button>
                    </>}
                  </form>
                </section>

                {/* GERENCIAMENTO DE COMBOS - sem alterar o formulário de cardápio existente */}
                <section className="bg-[#161616] border border-[#D95B1E]/30 rounded-xl p-4 sm:p-6 space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-3">
                    <div><h2 className="text-lg font-bold text-white">Combo do Dia</h2><p className="text-xs text-zinc-400 mt-1">Ofertas manuais ou programadas para o cardápio público.</p></div>
                    <div className="flex gap-2"><button type="button" onClick={()=>carregarCombos()} disabled={comboLoading} className="px-3 py-2 rounded-lg border border-[#444] text-xs text-zinc-200">Atualizar</button><button type="button" onClick={()=>abrirCombo(null)} className="px-4 py-2 rounded-lg bg-[#D95B1E] text-xs font-bold text-white">+ Novo combo</button></div>
                  </div>
                  {comboError && <div role="alert" className="p-3 rounded-lg bg-red-950/40 border border-red-900 text-red-300 text-xs">{comboError}</div>}
                  {comboLoading ? <p className="text-sm text-zinc-400">Carregando combos...</p> : !combos.length ? <p className="text-sm text-zinc-500 border border-dashed border-[#383838] rounded-lg p-5">Nenhum combo cadastrado. Clique em Novo combo para começar.</p> :
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">{combos.map(c=><article key={c.id} className="rounded-xl border border-[#333] bg-[#202020] p-3 flex gap-3">
                      {c.image_url ? <img src={c.image_url} alt="" className="w-24 h-24 object-cover rounded-lg shrink-0"/> : <div className="w-24 h-24 bg-[#292929] rounded-lg shrink-0 flex items-center justify-center text-zinc-500 text-xs">Sem foto</div>}
                      <div className="flex-1 min-w-0"><div className="flex items-center flex-wrap gap-2"><strong className="text-sm text-white">{c.name}</strong><span className="text-[10px] px-2 py-0.5 rounded-full bg-[#303030] text-zinc-300">{c.mode==='automatic'?'Automático':c.mode==='manual'?(c.manual_active?'Manual ativo':'Manual pausado'):'Desativado'}</span></div><p className="text-xs text-zinc-400 mt-1">{(c.foodstrick_combo_items||[]).map(i=>`${i.quantity} × ${produtos.find(p=>p.id===i.product_id)?.nome||'Produto'}`).join(' + ')}</p><p className="text-[#F28B50] font-bold mt-1">R$ {Number(c.price).toFixed(2).replace('.',',')}</p><div className="flex gap-2 mt-2"><button type="button" onClick={()=>abrirCombo(c)} className="bg-[#333] text-white rounded-lg px-3 py-1.5 text-xs">Editar</button><button type="button" disabled={comboBusy} onClick={()=>excluirCombo(c)} className="border border-red-900/70 text-red-300 rounded-lg px-3 py-1.5 text-xs">Excluir</button></div></div>
                    </article>)}</div>}
                  {comboEditorOpen && <form onSubmit={salvarCombo} className="border border-[#414141] bg-[#1b1b1b] rounded-xl p-4 space-y-4">
                    <div className="flex items-center justify-between"><h3 className="font-bold text-white">{comboForm.id?'Editar combo':'Cadastrar combo'}</h3><button type="button" onClick={()=>{setComboEditorOpen(false);setComboError('')}} className="text-zinc-400 text-xs">Fechar ✕</button></div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      <label className="text-xs text-zinc-300">Nome do combo<input required maxLength="120" value={comboForm.name} onChange={e=>setComboForm(f=>({...f,name:e.target.value}))} className="mt-1 w-full bg-[#262626] border border-[#444] rounded-lg p-3 text-white" placeholder="Combo Família"/></label>
                      <label className="text-xs text-zinc-300">Preço especial (R$)<input required type="number" min="0.01" step="0.01" value={comboForm.price} onChange={e=>setComboForm(f=>({...f,price:e.target.value}))} className="mt-1 w-full bg-[#262626] border border-[#444] rounded-lg p-3 text-white"/></label>
                    </div>
                    <label className="block text-xs text-zinc-300">Descrição<textarea rows="2" value={comboForm.description} onChange={e=>setComboForm(f=>({...f,description:e.target.value}))} className="mt-1 w-full bg-[#262626] border border-[#444] rounded-lg p-3 text-white"/></label>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3"><label className="text-xs text-zinc-300">Foto do combo<input type="file" accept="image/*" onChange={carregarFotoCombo} className="mt-1 block w-full text-xs text-zinc-300"/></label><label className="text-xs text-zinc-300">Ou URL da foto<input type="url" value={comboForm.image_url.startsWith('data:')?'':comboForm.image_url} onChange={e=>setComboForm(f=>({...f,image_url:e.target.value}))} className="mt-1 w-full bg-[#262626] border border-[#444] rounded-lg p-3 text-white" placeholder="https://..."/></label></div>
                    {comboForm.image_url && <img src={comboForm.image_url} alt="Prévia do combo" className="w-40 h-28 object-cover rounded-lg"/>}
                    <div><div className="flex items-center justify-between mb-2"><h4 className="text-sm font-bold text-white">Produtos e quantidades</h4><button type="button" onClick={()=>setComboForm(f=>({...f,items:[...f.items,{product_id:'',quantity:1}]}))} className="text-xs text-[#F28B50]">+ Adicionar produto</button></div>
                      {!comboForm.items.length && <p className="text-xs text-zinc-500">Adicione os itens que compõem o combo.</p>}
                      <div className="space-y-2">{comboForm.items.map((item,i)=><div key={i} className="flex flex-wrap gap-2"><select value={item.product_id} onChange={e=>setComboForm(f=>({...f,items:f.items.map((x,j)=>j===i?{...x,product_id:e.target.value}:x)}))} className="flex-1 min-w-[150px] bg-[#262626] border border-[#444] rounded-lg p-2 text-xs text-white"><option value="">Escolha o produto</option>{produtos.filter(p=>p.company_id===effectiveCompanyId||(effectiveCompanyId==='cozinha-brasileira'&&!p.company_id)).map(p=><option key={p.id} value={p.id}>{p.nome}</option>)}</select><input aria-label="Quantidade" type="number" min="1" step="1" value={item.quantity} onChange={e=>setComboForm(f=>({...f,items:f.items.map((x,j)=>j===i?{...x,quantity:e.target.value}:x)}))} className="w-20 bg-[#262626] border border-[#444] rounded-lg p-2 text-xs text-white"/><button type="button" onClick={()=>setComboForm(f=>({...f,items:f.items.filter((_,j)=>j!==i)}))} className="text-xs text-red-300 px-2">Remover</button></div>)}</div>
                    </div>
                    <div className="border-t border-[#333] pt-3"><label className="block text-xs text-zinc-300">Modo de funcionamento<select value={comboForm.mode} onChange={e=>setComboForm(f=>({...f,mode:e.target.value}))} className="mt-1 block w-full bg-[#262626] border border-[#444] rounded-lg p-3 text-white"><option value="disabled">Desativado</option><option value="manual">Manual</option><option value="automatic">Automático (dias e horários)</option></select></label>
                      {comboForm.mode==='manual' && <label className="flex items-center gap-2 mt-3 text-xs text-zinc-300"><input type="checkbox" checked={comboForm.manual_active} onChange={e=>setComboForm(f=>({...f,manual_active:e.target.checked}))} className="accent-orange-600"/> Exibir combo agora</label>}
                      {comboForm.mode==='automatic' && <div className="space-y-3 mt-3"><p className="text-xs text-zinc-400">Horário local: America/Campo_Grande. Dia 0 = domingo.</p><button type="button" onClick={()=>setComboForm(f=>({...f,schedules:[...f.schedules,{weekday:1,start_time:'11:00',end_time:'14:00'}]}))} className="text-xs text-[#F28B50]">+ Adicionar horário</button>{comboForm.schedules.map((x,i)=><div key={i} className="flex flex-wrap gap-2"><select aria-label="Dia da semana" value={x.weekday} onChange={e=>setComboForm(f=>({...f,schedules:f.schedules.map((v,j)=>j===i?{...v,weekday:Number(e.target.value)}:v)}))} className="bg-[#262626] border border-[#444] rounded-lg p-2 text-xs text-white">{['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'].map((d,n)=><option key={n} value={n}>{d}</option>)}</select><input aria-label="Início" type="time" value={x.start_time} onChange={e=>setComboForm(f=>({...f,schedules:f.schedules.map((v,j)=>j===i?{...v,start_time:e.target.value}:v)}))} className="bg-[#262626] border border-[#444] rounded-lg p-2 text-xs text-white"/><input aria-label="Fim" type="time" value={x.end_time} onChange={e=>setComboForm(f=>({...f,schedules:f.schedules.map((v,j)=>j===i?{...v,end_time:e.target.value}:v)}))} className="bg-[#262626] border border-[#444] rounded-lg p-2 text-xs text-white"/><button type="button" onClick={()=>setComboForm(f=>({...f,schedules:f.schedules.filter((_,j)=>j!==i)}))} className="text-xs text-red-300">Remover</button></div>)}</div>}
                    </div>
                    <div className="flex flex-wrap gap-2"><button type="submit" disabled={comboBusy} className="bg-[#D95B1E] text-white rounded-lg px-5 py-3 text-sm font-bold disabled:opacity-50">{comboBusy?'Salvando...':'Salvar combo'}</button><button type="button" onClick={()=>setComboEditorOpen(false)} className="border border-[#444] text-zinc-300 rounded-lg px-4 py-3 text-sm">Cancelar</button></div>
                  </form>}
                </section>

                <form onSubmit={salvarConfiguracaoCardapio} className="bg-[#161616] border border-[#262626] rounded-xl p-4 sm:p-6 space-y-4">
                  <h2 className="font-bold text-white">Aparência e funcionamento</h2>
                  {menuSettingsError && <p className="text-sm text-red-400">{menuSettingsError}</p>}
                  <label className="flex items-center gap-3 text-sm text-zinc-200"><input type="checkbox" checked={!!menuSettings.menu_enabled} onChange={e=>setMenuSettings(v=>({...v,menu_enabled:e.target.checked}))} className="accent-orange-600"/> Cardápio publicado</label>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label className="block text-xs text-zinc-400 mb-1">Nome público</label><input value={effectiveCompanyName || ''} readOnly className="w-full bg-[#202020] border border-[#333] rounded-lg p-3 text-sm text-zinc-400"/></div>
                    <div><label className="block text-xs text-zinc-400 mb-1">Final do link público</label><input required value={menuSettings.menu_slug} onChange={e=>setMenuSettings(v=>({...v,menu_slug:e.target.value}))} placeholder="ex.: minha-lanchonete" className="w-full bg-[#202020] border border-[#333] rounded-lg p-3 text-sm text-white"/><p className="text-[10px] text-zinc-500 mt-1">Link: foodstrick.vercel.app/loja/{menuSettings.menu_slug || 'seu-restaurante'}</p></div>
                    <div><label className="block text-xs text-zinc-400 mb-1">Descrição do restaurante</label><textarea value={menuSettings.menu_description} onChange={e=>setMenuSettings(v=>({...v,menu_description:e.target.value}))} maxLength={500} rows={3} placeholder="Conte um pouco sobre o restaurante" className="w-full bg-[#202020] border border-[#333] rounded-lg p-3 text-sm text-white"/></div>
                    <div><label className="block text-xs text-zinc-400 mb-1">Cor principal</label><div className="flex gap-3 items-center"><input type="color" value={menuSettings.menu_accent_color} onChange={e=>setMenuSettings(v=>({...v,menu_accent_color:e.target.value}))} className="h-11 w-16 bg-transparent border border-[#333] rounded-lg"/><span className="text-xs text-zinc-400">{menuSettings.menu_accent_color}</span></div></div>
                  </div>
                  <div className="rounded-xl border border-[#333] bg-[#1c1c1c] p-4 space-y-3">
                    <div><h3 className="font-bold text-sm text-white">Imagem de capa do cardápio</h3><p className="text-xs text-zinc-400 mt-1">Personalize o banner superior do cardápio público. Prefira uma imagem horizontal, com espaço livre para o título.</p></div>
                    <input type="file" accept="image/*" onChange={handleMenuCoverUpload} className="w-full bg-[#202020] border border-[#333] rounded-lg p-3 text-xs text-zinc-300 file:mr-3 file:rounded-md file:border-0 file:bg-[#D95B1E] file:px-3 file:py-2 file:font-bold file:text-white"/>
                    {menuSettings.menu_cover_image && <><button type="button" title="Clique para editar o enquadramento" onClick={()=>setCoverEditorSource(menuSettings.menu_cover_image)} className="relative block w-full overflow-hidden rounded-xl bg-[#111] border border-[#333] text-left group"><img src={menuSettings.menu_cover_image} alt="Prévia da capa do cardápio" className="w-full aspect-[10/3] object-cover"/><div className="absolute inset-0 bg-gradient-to-r from-black/80 to-black/20"/><span className="absolute bottom-4 left-4 text-white font-bold">Prévia da capa — clique para ajustar</span><span className="absolute top-3 right-3 bg-black/70 rounded-md px-3 py-2 text-xs text-white group-hover:bg-[#D95B1E]">Editar enquadramento</span></button><button type="button" onClick={()=>setMenuSettings(v=>({...v,menu_cover_image:''}))} className="text-xs border border-[#444] rounded-lg px-3 py-2 text-zinc-200 hover:bg-[#292929]">Remover imagem de capa</button></>}
                    <p className="text-xs text-zinc-500">Depois de escolher, clique em Salvar configurações para publicar a imagem.</p>
                  </div>
                  <div className="flex flex-wrap gap-5 text-sm text-zinc-300"><label className="flex items-center gap-2"><input type="checkbox" checked={!!menuSettings.menu_allow_delivery} onChange={e=>setMenuSettings(v=>({...v,menu_allow_delivery:e.target.checked}))} className="accent-orange-600"/> Entrega</label><label className="flex items-center gap-2"><input type="checkbox" checked={!!menuSettings.menu_allow_pickup} onChange={e=>setMenuSettings(v=>({...v,menu_allow_pickup:e.target.checked}))} className="accent-orange-600"/> Retirada</label></div>
                  <div><label className="block text-xs text-zinc-400 mb-2">Formas de pagamento</label><div className="flex flex-wrap gap-4 text-sm text-zinc-300">{['Pix','Dinheiro','Cartão'].map(m=><label key={m} className="flex items-center gap-2"><input type="checkbox" checked={menuSettings.menu_payment_methods.includes(m)} onChange={e=>setMenuSettings(v=>({...v,menu_payment_methods:e.target.checked?[...v.menu_payment_methods,m]:v.menu_payment_methods.filter(x=>x!==m)}))} className="accent-orange-600"/>{m}</label>)}</div></div>
                  <section className="rounded-xl border border-[#383838] bg-[#1b1b1b] p-4 space-y-3">
                    <h3 className="font-bold text-white">Pagamentos Pix do restaurante</h3>
                    <label className="flex gap-2 items-center text-sm"><input type="checkbox" checked={!!menuSettings.pix_manual_enabled} onChange={e=>setMenuSettings(v=>({...v,pix_manual_enabled:e.target.checked}))}/> Ativar Pix por chave (confirmação manual)</label>
                    {menuSettings.pix_manual_enabled && <div className="grid sm:grid-cols-2 gap-3">
                      <label className="text-xs text-zinc-300">Chave Pix<input value={menuSettings.pix_key} onChange={e=>setMenuSettings(v=>({...v,pix_key:e.target.value}))} placeholder="Chave Pix do estabelecimento" className="block mt-1 w-full bg-[#252525] border border-[#444] rounded-lg p-3 text-sm"/></label>
                      <label className="text-xs text-zinc-300">Nome do recebedor (até 25 caracteres)<input maxLength={25} value={menuSettings.pix_receiver_name} onChange={e=>setMenuSettings(v=>({...v,pix_receiver_name:e.target.value}))} className="block mt-1 w-full bg-[#252525] border border-[#444] rounded-lg p-3 text-sm"/></label>
                      <label className="text-xs text-zinc-300">Cidade do recebedor (até 15 caracteres)<input maxLength={15} value={menuSettings.pix_receiver_city} onChange={e=>setMenuSettings(v=>({...v,pix_receiver_city:e.target.value}))} className="block mt-1 w-full bg-[#252525] border border-[#444] rounded-lg p-3 text-sm"/></label>
                    </div>}
                    <div className="rounded-xl border border-[#444] p-3 space-y-2">
                      <p className="text-xs font-bold text-white">Conectar InfinitePay desta empresa</p>
                      <p className="text-xs text-zinc-400">A API Key é enviada ao servidor e armazenada cifrada. Nunca coloque a chave no GitHub.</p>
                      <input value={ipHandle} onChange={e=>setIpHandle(e.target.value)} placeholder="InfiniteTag sem $" autoComplete="off" className="w-full bg-[#252525] border border-[#444] rounded-lg p-3 text-sm"/>
                      <input type="password" value={ipKey} onChange={e=>setIpKey(e.target.value)} placeholder="API Key inchk_..." autoComplete="new-password" className="w-full bg-[#252525] border border-[#444] rounded-lg p-3 text-sm"/>
                      <button type="button" disabled={ipSaving} onClick={salvarCredenciaisInfinitePay} className="rounded-lg border border-orange-700 px-4 py-2 text-sm font-bold text-orange-300 disabled:opacity-50">{ipSaving?'Conectando...':'Salvar credenciais InfinitePay'}</button>
                    </div>
                    <label className="flex gap-2 items-center text-sm"><input type="checkbox" checked={!!menuSettings.pix_auto_enabled} onChange={e=>setMenuSettings(v=>({...v,pix_auto_enabled:e.target.checked}))}/> Ativar Pix automático InfinitePay (após instalar o servidor)</label>
                    {menuSettings.pix_auto_enabled && <><select value={menuSettings.pix_provider} onChange={e=>setMenuSettings(v=>({...v,pix_provider:e.target.value}))} className="bg-[#252525] border border-[#444] rounded-lg p-3 text-sm"><option value="infinitepay">InfinitePay</option><option value="mercadopago">Mercado Pago</option><option value="asaas">Asaas</option></select></>}
                    <p className="text-xs text-zinc-400">No Pix por chave, confira o extrato antes de aceitar o pedido como pago. Nunca confirme apenas por comprovante ou clique do cliente.</p>
                  </section>
                  <button disabled={menuSaving} className="rounded-lg bg-[#D95B1E] hover:bg-[#c34e17] disabled:opacity-50 px-5 py-3 text-sm font-bold text-white">{menuSaving?'Salvando...':'Salvar configurações'}</button>
                </form>
                <div className="grid grid-cols-1 lg:grid-cols-5 gap-6">
                  <form onSubmit={salvarProdutoCardapio} className="lg:col-span-2 bg-[#161616] border border-[#262626] rounded-xl p-4 sm:p-6 space-y-3 h-fit">
                    <div className="flex items-center justify-between gap-2"><h2 className="font-bold text-white">{menuProductForm.id?'Editar item':'Adicionar item'}</h2>{menuProductForm.id&&<button type="button" onClick={()=>setMenuProductForm({id:null,nome:'',preco_venda:'',custo_unitario:'0',menu_description:'',menu_ingredients:'',menu_category:'Pratos',menu_image_url:'',menu_available:true})} className="text-xs text-zinc-400 hover:text-white">Cancelar edição</button>}</div>
                    <div><label className="block text-xs text-zinc-400 mb-1">Nome do produto</label><input required value={menuProductForm.nome} onChange={e=>setMenuProductForm(v=>({...v,nome:e.target.value}))} maxLength={120} className="w-full bg-[#202020] border border-[#333] rounded-lg p-3 text-sm text-white"/></div>
                    <div><label className="block text-xs text-zinc-400 mb-1">Preço (R$)</label><input required type="number" min="0" step="0.01" value={menuProductForm.preco_venda} onChange={e=>setMenuProductForm(v=>({...v,preco_venda:e.target.value}))} className="w-full bg-[#202020] border border-[#333] rounded-lg p-3 text-sm text-white"/></div>
                    <div><label className="block text-xs text-zinc-400 mb-1">Custo unitário (R$) — para manter os cálculos financeiros</label><input type="number" min="0" step="0.01" value={menuProductForm.custo_unitario} onChange={e=>setMenuProductForm(v=>({...v,custo_unitario:e.target.value}))} className="w-full bg-[#202020] border border-[#333] rounded-lg p-3 text-sm text-white"/></div>
                    <div><label className="block text-xs text-zinc-400 mb-1">Categoria</label><input value={menuProductForm.menu_category} onChange={e=>setMenuProductForm(v=>({...v,menu_category:e.target.value}))} placeholder="Hambúrgueres, Bebidas..." maxLength={60} className="w-full bg-[#202020] border border-[#333] rounded-lg p-3 text-sm text-white"/></div>
                    <div><label className="block text-xs text-zinc-400 mb-1">Descrição do prato</label><textarea value={menuProductForm.menu_description} onChange={e=>setMenuProductForm(v=>({...v,menu_description:e.target.value}))} maxLength={800} rows={3} placeholder="Descrição que aparecerá para o cliente" className="w-full bg-[#202020] border border-[#333] rounded-lg p-3 text-sm text-white"/></div>
                    <div><label className="block text-xs text-zinc-400 mb-1">Ingredientes</label><textarea value={menuProductForm.menu_ingredients} onChange={e=>setMenuProductForm(v=>({...v,menu_ingredients:e.target.value}))} maxLength={800} rows={2} placeholder="Pão, carne, queijo, alface..." className="w-full bg-[#202020] border border-[#333] rounded-lg p-3 text-sm text-white"/></div>
                    <div><label className="block text-xs text-zinc-400 mb-1">Foto do produto</label><input type="file" accept="image/*" onChange={handleMenuImageUpload} className="w-full bg-[#202020] border border-[#333] rounded-lg p-3 text-xs text-zinc-300 file:mr-3 file:rounded-md file:border-0 file:bg-[#D95B1E] file:px-3 file:py-2 file:font-bold file:text-white"/><label className="block text-[10px] text-zinc-500 mt-2 mb-1">Ou cole a URL direta da imagem</label><input type="url" value={menuProductForm.menu_image_url.startsWith("data:") ? "" : menuProductForm.menu_image_url} onChange={e=>setMenuProductForm(v=>({...v,menu_image_url:e.target.value}))} placeholder="https://..." className="w-full bg-[#202020] border border-[#333] rounded-lg p-3 text-sm text-white"/><p className="text-[10px] text-zinc-500 mt-1">A imagem selecionada é reduzida antes de ser salva para diminuir o tamanho do arquivo.</p></div>
                    {menuProductForm.menu_image_url&&<img src={menuProductForm.menu_image_url} alt="Prévia do produto" className="w-full h-36 object-cover rounded-lg border border-[#333]" onError={e=>{e.currentTarget.style.display='none'}}/>}
                    <label className="flex items-center gap-2 text-sm text-zinc-300"><input type="checkbox" checked={!!menuProductForm.menu_available} onChange={e=>setMenuProductForm(v=>({...v,menu_available:e.target.checked}))} className="accent-orange-600"/> Disponível no cardápio</label>
                    <button disabled={menuSaving} className="w-full rounded-lg bg-[#D95B1E] hover:bg-[#c34e17] disabled:opacity-50 px-4 py-3 text-sm font-bold text-white">{menuSaving?'Salvando...':menuProductForm.id?'Salvar alterações':'Cadastrar produto'}</button>
                  </form>
                  <section className="lg:col-span-3 bg-[#161616] border border-[#262626] rounded-xl p-4 sm:p-6">
                    <div className="flex items-center justify-between mb-4"><h2 className="font-bold text-white">Produtos do cardápio</h2><span className="text-xs text-zinc-500">{produtos.length} itens</span></div>
                    {!produtos.length?<p className="text-sm text-zinc-500 py-8 text-center">Nenhum produto cadastrado para esta empresa ainda.</p>:<div className="space-y-3">{produtos.map(p=><article key={p.id} className="flex gap-3 border border-[#2b2b2b] bg-[#1b1b1b] rounded-xl p-3">{p.menu_image_url?<img src={p.menu_image_url} alt="" className="w-20 h-20 rounded-lg object-cover shrink-0"/>:<div className="w-20 h-20 rounded-lg bg-[#252525] flex items-center justify-center text-zinc-600 shrink-0"><svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></div>}<div className="flex-1 min-w-0"><div className="flex flex-wrap items-center gap-2"><h3 className="font-semibold text-sm text-white">{p.nome}</h3><span className={`text-[10px] px-2 py-0.5 rounded-full ${p.menu_available===false?'bg-zinc-700 text-zinc-300':'bg-emerald-950 text-emerald-300'}`}>{p.menu_available===false?'Indisponível':'Disponível'}</span></div><p className="text-xs text-zinc-400 mt-1 line-clamp-2">{p.menu_description||p.observacao||'Sem descrição'}</p><p className="text-sm font-bold text-[#F28B50] mt-2">R$ {Number(p.preco_venda||0).toFixed(2).replace('.',',')}</p><div className="flex flex-wrap gap-2 mt-2"><button type="button" onClick={()=>editarProdutoCardapio(p)} className="text-xs bg-[#292929] hover:bg-[#353535] rounded-lg px-3 py-1.5 text-white">Editar</button><button type="button" onClick={()=>alternarDisponibilidadeCardapio(p)} className="text-xs bg-[#292929] hover:bg-[#353535] rounded-lg px-3 py-1.5 text-zinc-300">{p.menu_available===false?'Disponibilizar':'Indisponibilizar'}</button></div></div></article>)}</div>}
                  </section>
                </div>
              </div>
            )}

            {/* 4. ABA FICHAS TÉCNICAS */}
            {abaAtiva === 'fichas' && (!isSuperAdmin || impersonatedCompany) && (
              <div className="max-w-6xl">
                <header className="mb-5">
                  <h1 className="text-xl sm:text-2xl font-bold text-white">Central de Fichas Técnicas</h1>
                  <p className="text-[11px] sm:text-xs text-zinc-400">Controlo de insumos e pesagem</p>
                </header>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                  {produtos.map(p => {
                    const ingList = Array.isArray(p.ingredientes) ? p.ingredientes : [];
                    const somaCusto = ingList.reduce((acc, curr) => acc + Number(curr.custo || 0), 0);
                    const custoFinal = ingList.length > 0 ? somaCusto : Number(p.custo_unitario || 0);
                    const preco = Number(p.preco_venda || 0);
                    const margem = preco - custoFinal;

                    return (
                      <div key={p.id} className="bg-[#161616] border border-[#262626] rounded-xl p-4 flex flex-col justify-between">
                        <div>
                          <div className="flex items-start justify-between mb-2.5">
                            <div>
                              <h3 className="text-sm sm:text-base font-bold text-white">{p.nome}</h3>
                              <span className="text-[10px] text-zinc-500">{ingList.length} insumos</span>
                            </div>
                            <span className="text-xs font-mono font-bold text-emerald-400 bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-900/60">
                              R$ {custoFinal.toFixed(2)}
                            </span>
                          </div>

                          <div className="bg-[#1f1f1f] rounded-lg p-2.5 my-2 space-y-1 text-xs text-zinc-300">
                            {ingList.length === 0 ? (
                              <p className="text-zinc-500 italic text-[11px]">Nenhum ingrediente adicionado.</p>
                            ) : (
                              ingList.slice(0, 3).map((item, idx) => (
                                <div key={idx} className="flex justify-between text-[11px]">
                                  <span className="text-zinc-400 truncate max-w-[130px]">{item.nome} ({item.quantidade})</span>
                                  <span className="text-white font-mono">R$ {Number(item.custo).toFixed(2)}</span>
                                </div>
                              ))
                            )}
                          </div>
                        </div>

                        <div className="pt-2.5 border-t border-[#262626] flex items-center justify-between">
                          <span className="text-emerald-400 text-xs font-semibold">Margem: R$ {margem.toFixed(2)}</span>
                          <button onClick={() => setModalFichaTecnica({ aberto: true, produto: p })} className="bg-emerald-950/60 hover:bg-emerald-900 text-emerald-400 border border-emerald-800/60 font-bold px-3 py-1.5 rounded-lg text-xs cursor-pointer">
                            Abrir Ficha
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* 5. ABA FECHAMENTO MENSAL */}
            {abaAtiva === 'estoque' && (!isSuperAdmin || impersonatedCompany) && <FoodStrickStock companyId={effectiveCompanyId} client={supabaseClient} />}

            {abaAtiva === 'fechamento' && (!isSuperAdmin || impersonatedCompany) && (
              <div className="max-w-6xl">
                <header className="mb-5">
                  <h1 className="text-xl sm:text-2xl font-bold text-white">Fechamento do Mês</h1>
                  <p className="text-[11px] sm:text-xs text-zinc-400">Consolidação e reinício de ciclo</p>
                </header>

                <div className="bg-[#161616] border border-[#D95B1E]/40 rounded-2xl p-4 sm:p-6 mb-6 shadow-xl">
                  <div className="flex items-center justify-between pb-3.5 mb-4 border-b border-[#262626]">
                    <h2 className="text-sm sm:text-base font-bold text-white flex items-center gap-2">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D95B1E" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                      Resumo Atual
                    </h2>
                    <span className="text-[10px] sm:text-xs font-mono font-bold text-[#D95B1E] bg-[#D95B1E]/10 border border-[#D95B1E]/30 px-2 py-0.5 rounded">
                      {lancamentosAtivos.length} ativos
                    </span>
                  </div>

                  <div className="grid grid-cols-2 md:grid-cols-4 gap-2.5 sm:gap-4 mb-5">
                    <div className="bg-[#1f1f1f] p-3 rounded-xl border border-[#2d2d2d]"><span className="text-[9px] text-zinc-500 uppercase block">Faturamento</span><span className="text-sm sm:text-lg font-bold text-white">R$ {faturamento.toFixed(2)}</span></div>
                    <div className="bg-[#1f1f1f] p-3 rounded-xl border border-[#2d2d2d]"><span className="text-[9px] text-zinc-500 uppercase block">Despesas</span><span className="text-sm sm:text-lg font-bold text-red-400">R$ {totalDespesas.toFixed(2)}</span></div>
                    <div className="bg-[#1f1f1f] p-3 rounded-xl border border-[#2d2d2d]"><span className="text-[9px] text-zinc-500 uppercase block">Lucro</span><span className="text-sm sm:text-lg font-bold text-emerald-400">R$ {resultadoMes.toFixed(2)}</span></div>
                    <div className="bg-[#1f1f1f] p-3 rounded-xl border border-[#2d2d2d]"><span className="text-[9px] text-zinc-500 uppercase block">Volume</span><span className="text-xs sm:text-sm font-bold text-zinc-200 mt-0.5 block">{totalPratos}P / {totalBebidas}B</span></div>
                  </div>

                  <button onClick={handleExecutarFechamento} disabled={processandoFechamento || lancamentosAtivos.length === 0} className="w-full bg-[#D95B1E] hover:bg-[#c34e17] disabled:opacity-50 text-white font-bold py-3.5 sm:py-3 rounded-xl text-xs transition-all shadow-lg active:scale-95 cursor-pointer">
                    {processandoFechamento ? 'A processar...' : 'Encerrar Mês & Arquivar Lançamentos'}
                  </button>
                </div>

                <div>
                  <h2 className="text-sm sm:text-base font-bold text-white mb-3">Extratos Anteriores</h2>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 items-start">
                    <div>
                  {historicoFechamentos.length === 0 ? (
                    <div className="bg-[#161616] border border-[#262626] rounded-xl p-5 text-center text-zinc-500 text-xs italic">Nenhum fechamento realizado até ao momento.</div>
                  ) : (
                    <div className="grid grid-cols-1 gap-3">
                      {historicoFechamentos.map(fech => (
                        <div key={fech.id} role="button" tabIndex={0} onClick={() => setExtratoSelecionado(fech)} onKeyDown={e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setExtratoSelecionado(fech); } }} className="bg-[#161616] border border-[#262626] rounded-xl p-4 cursor-pointer hover:border-[#D95B1E]/50 transition-colors" title="Clique para visualizar o extrato">
                          <div className="flex justify-between items-center pb-2 border-b border-[#262626] mb-2">
                            <h3 className="font-bold text-white text-xs">Mês: {fech.mes_ano}</h3>
                            <span className="text-[10px] text-zinc-500">{new Date(fech.data_fechamento).toLocaleDateString()}</span>
                          </div>
                          <div className="space-y-1 text-xs">
                            <div className="flex justify-between"><span className="text-zinc-400">Faturação:</span><span className="text-white font-mono">R$ {Number(fech.relatorio.faturamento).toFixed(2)}</span></div>
                            <div className="flex justify-between"><span className="text-zinc-400">Despesas:</span><span className="text-red-400 font-mono">R$ {Number(fech.relatorio.despesas).toFixed(2)}</span></div>
                            <div className="flex justify-between border-t border-[#262626] pt-1 font-bold"><span className="text-zinc-300">Lucro:</span><span className="text-emerald-400 font-mono">R$ {Number(fech.relatorio.lucro).toFixed(2)}</span></div>
                          </div>
                          <button type="button" onClick={e => { e.stopPropagation(); setExtratoSelecionado(fech); }} className="mt-3 w-full text-xs font-bold text-[#D95B1E] border border-[#D95B1E]/40 hover:bg-[#D95B1E]/10 rounded-lg py-2 transition-colors">Ver extrato completo</button>
                        </div>
                      ))}
                    </div>
                  )}
                    </div>
                    <div className="hidden md:block">
                      {extratoSelecionado && historicoFechamentos.some(f => f.id === extratoSelecionado.id) && (
                        <ExtratoDetalhado fechamento={extratoSelecionado} lancamentos={lancamentos} onClose={() => setExtratoSelecionado(null)} />
                      )}
                    </div>
                  </div>
                  {extratoSelecionado && historicoFechamentos.some(f => f.id === extratoSelecionado.id) && (
                    <div className="md:hidden">
                      <ExtratoDetalhado fechamento={extratoSelecionado} lancamentos={lancamentos} onClose={() => setExtratoSelecionado(null)} />
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* 6. CONFIGURAÇÕES & ADMINISTRAÇÃO B2B */}
            {abaAtiva === 'configuracoes' && (
              <div className="max-w-6xl">
                <div className="md:hidden flex items-center gap-1.5 overflow-x-auto pb-3 mb-4 border-b border-[#242424]">
                  {(!isSuperAdmin || impersonatedCompany) && (
                    <button onClick={() => setSubAbaConfig('exclusoes')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap ${subAbaConfig === 'exclusoes' ? 'bg-[#D95B1E] text-white' : 'bg-[#1c1c1c] text-zinc-400'}`}>
                      Lixeira
                    </button>
                  )}
                  <button onClick={() => setSubAbaConfig('conta')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap ${subAbaConfig === 'conta' ? 'bg-[#D95B1E] text-white' : 'bg-[#1c1c1c] text-zinc-400'}`}>
                    Minha Conta
                  </button>
                  {!isSuperAdmin && (
                    <button onClick={() => setSubAbaConfig('suporte')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap ${subAbaConfig === 'suporte' ? 'bg-[#D95B1E] text-white' : 'bg-[#1c1c1c] text-zinc-400'}`}>
                      Suporte técnico
                    </button>
                  )}
                  {isSuperAdmin && (
                    <button onClick={() => { setSubAbaConfig('empresas'); fetchCompanies(); }} className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap ${subAbaConfig === 'empresas' ? 'bg-blue-600 text-white' : 'bg-[#1c1c1c] text-blue-400'}`}>
                      Gestão Cozinhas (B2B)
                    </button>
                  )}
                </div>

                {subAbaConfig === 'exclusoes' && (!isSuperAdmin || impersonatedCompany) && (
                  <div>
                    <h1 className="text-xl sm:text-2xl font-bold text-white mb-1">Lixeira de Exclusões</h1>
                    <div className="bg-[#161616] border border-[#262626] rounded-xl p-4 overflow-x-auto mt-4">
                      {lancamentosExcluidos.length === 0 ? <p className="text-zinc-500 text-xs italic">Nenhum registo cancelado.</p> : (
                        <table className="w-full text-left text-xs text-zinc-400 min-w-[500px]">
                          <thead className="border-b border-[#262626]">
                            <tr><th className="pb-2.5 uppercase">Data</th><th className="pb-2.5 uppercase">Descrição</th><th className="pb-2.5 uppercase text-right">Valor</th><th className="pb-2.5 uppercase text-red-400 pl-4">Motivo</th></tr>
                          </thead>
                          <tbody className="divide-y divide-[#262626]">
                            {lancamentosExcluidos.map(l => (
                              <tr key={l.id} className="hover:bg-[#1c1c1c]">
                                <td className="py-2.5">{l.data}</td>
                                <td className="py-2.5 text-zinc-400 line-through">{l.descricao}</td>
                                <td className="py-2.5 text-right text-zinc-400 line-through">R$ {Number(l.valor_total).toFixed(2)}</td>
                                <td className="py-2.5 text-red-400 font-bold pl-4">{l.motivo_exclusao}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      )}
                    </div>
                  </div>
                )}

                {subAbaConfig === 'suporte' && !isSuperAdmin && (
                  <section className="bg-[#161616] border border-[#303030] p-5 sm:p-7 rounded-2xl space-y-4 max-w-2xl">
                    <h1 className="text-xl font-bold text-white">Suporte técnico FoodStrick</h1>
                    <p className="text-xs text-zinc-400">Somente o administrador do restaurante pode gerar uma chave. Ela expira em 30 minutos, é de uso único e não revela sua senha.</p>
                    {supportError && <p role="alert" className="text-xs text-red-300">{supportError}</p>}
                    {supportSessions[currentUser?.company_id] && <p className="text-xs text-emerald-300">Sessão ativa até {new Date(supportSessions[currentUser.company_id].expires_at).toLocaleString('pt-BR')}.</p>}
                    {supportKey && <div className="bg-[#222] rounded-xl border border-orange-700/40 p-4 space-y-2"><p className="text-xs text-zinc-400">Copie agora. Esta chave não será mostrada novamente.</p><p className="font-mono text-sm text-orange-300 break-all select-all">{supportKey}</p><p className="text-xs text-zinc-400">Expira em {new Date(supportKeyExpiry).toLocaleString('pt-BR')}</p><button type="button" onClick={() => navigator.clipboard.writeText(supportKey)} className="text-xs font-bold bg-[#D95B1E] px-3 py-2 rounded-lg">Copiar chave</button></div>}
                    <div className="flex flex-wrap gap-2">
                      <button type="button" disabled={supportBusy} onClick={supportCreate} className="bg-[#D95B1E] disabled:opacity-50 text-white font-bold px-4 py-2 rounded-lg text-xs">Gerar nova chave</button>
                      <button type="button" disabled={supportBusy} onClick={() => supportRefresh()} className="border border-[#444] text-white px-4 py-2 rounded-lg text-xs">Consultar status</button>
                      <button type="button" disabled={supportBusy} onClick={supportRevoke} className="border border-red-800 text-red-300 px-4 py-2 rounded-lg text-xs">Revogar suporte</button>
                    </div>
                  </section>
                )}

                {subAbaConfig === 'empresas' && isSuperAdmin && (
                  <div>
                    <h1 className="text-xl sm:text-2xl font-bold text-white mb-4">Gestão de Clientes (B2B)</h1>
                    <form onSubmit={handleCreateCompanyB2B} className="bg-[#161616] border border-[#262626] p-4 sm:p-6 rounded-xl mb-6 space-y-3">
                      <h2 className="text-xs font-bold text-blue-400 uppercase tracking-wider">Registar Nova Cozinha</h2>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                        <input type="text" placeholder="Nome do Cliente" value={newCompanyName} onChange={e => setNewCompanyName(e.target.value)} className="bg-[#202020] border border-[#333] rounded-lg p-2.5 text-base md:text-xs text-white outline-none" required />
                        <input type="text" placeholder="ID gerado automaticamente" value={newCompanySlug} disabled title="O servidor gera o identificador automaticamente" className="bg-[#202020] border border-[#333] rounded-lg p-2.5 text-base md:text-xs text-white outline-none" />
                        <input type="text" placeholder="Telefone (configurar depois)" value={newCompanyPhone} disabled title="Não suportado pela operação de criação atual" className="bg-[#202020] border border-[#333] rounded-lg p-2.5 text-base md:text-xs text-white outline-none" />
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        <input type="email" placeholder="E-mail do administrador" value={newCompanyAdminUser} onChange={e => setNewCompanyAdminUser(e.target.value)} className="bg-[#202020] border border-[#333] rounded-lg p-2.5 text-base md:text-xs text-white outline-none" required />
                        <p className="text-xs text-zinc-400 self-center">O administrador receberá um convite para configurar a senha.</p>
                      </div>
                      <button type="submit" disabled={masterSaving} className="w-full bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-bold py-2.5 rounded-lg text-xs">{masterSaving ? 'Processando...' : 'Criar empresa e enviar convite'}</button>
                    </form>

                    <div className="bg-[#161616] border border-[#262626] rounded-xl p-4">
                      <div className="flex flex-wrap justify-between items-center gap-3 mb-3">
                        <h2 className="text-xs font-bold text-zinc-400 uppercase tracking-wider">Cozinhas Registadas ({companiesList.length})</h2>
                        <button type="button" onClick={fetchCompanies} disabled={masterLoading || masterSaving} className="rounded-lg border border-[#444] px-3 py-2 text-xs font-semibold text-white disabled:opacity-50">{masterLoading ? 'Atualizando...' : 'Atualizar lista'}</button>
                      </div>
                      {masterError && <p role="alert" className="text-xs text-red-300 bg-red-950/30 border border-red-900/50 p-3 rounded-lg mb-3">{masterError}</p>}
                      {!masterLoading && !masterError && companiesList.length === 0 && <p className="text-xs text-zinc-400 p-3">Nenhuma empresa encontrada.</p>}
                      <div className="space-y-2">
                        {companiesList.map(comp => (
                          <div key={comp.id} className="bg-[#202020] p-3 rounded-lg border border-[#2d2d2d] flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
                            <div>
                              <p className="text-xs sm:text-sm font-bold text-white flex items-center gap-2">{comp.company_name} <span className={`text-[9px] px-1.5 py-0.2 rounded font-bold uppercase ${comp.status === 'ativo' ? 'bg-emerald-950 text-emerald-400' : 'bg-red-950 text-red-400'}`}>{comp.status}</span></p>
                              <p className="text-[10px] text-zinc-500 font-mono">ID: {comp.company_id}</p>
                            </div>
                            <div className="flex items-center gap-2">
                              <button type="button" onClick={() => { setSupportSelectedCompany(supportSelectedCompany === comp.company_id ? '' : comp.company_id); supportRefresh(comp.company_id); }} className="flex-1 sm:flex-initial bg-amber-900/20 text-amber-300 border border-amber-700/40 px-3 py-1.5 rounded-lg text-xs font-bold">Autorizar suporte</button>
                              <button onClick={() => handleToggleCompanyStatus(comp.company_id, comp.status)} disabled={masterSaving || comp.company_id === 'foodstrick-master'} className="bg-zinc-800 text-zinc-300 px-3 py-1.5 rounded-lg text-xs font-medium">{comp.status === 'ativo' ? 'Suspender' : 'Reativar'}</button>
                            </div>
                            {supportSelectedCompany === comp.company_id && <div className="w-full sm:basis-full border-t border-[#333] pt-3 space-y-2">
                              <p className="text-xs text-zinc-400">Solicite ao restaurante uma chave de suporte. A sessão permite acesso temporário, sujeito às permissões e à auditoria no Supabase.</p>
                              {supportError && <p role="alert" className="text-xs text-red-300">{supportError}</p>}
                              {supportSessions[comp.company_id] && <p className="text-xs text-emerald-300">Sessão registrada até {new Date(supportSessions[comp.company_id].expires_at).toLocaleString('pt-BR')}</p>}
                              <div className="flex flex-wrap gap-2">
                                <input type="text" autoComplete="off" placeholder="Chave FS-..." value={supportKeyInputs[comp.company_id] || ''} onChange={e => setSupportKeyInputs(prev => ({...prev, [comp.company_id]: e.target.value}))} className="flex-1 min-w-[180px] bg-[#151515] border border-[#444] rounded-lg px-3 py-2 text-xs text-white" />
                                <button type="button" disabled={supportBusy} onClick={() => supportRedeem(comp.company_id)} className="bg-[#D95B1E] disabled:opacity-50 text-white px-3 py-2 rounded-lg text-xs font-bold">Validar chave</button>
                                <button type="button" disabled={supportBusy} onClick={() => supportRefresh(comp.company_id)} className="border border-[#444] text-white px-3 py-2 rounded-lg text-xs">Status</button>
                                {supportSessions[comp.company_id] && new Date(supportSessions[comp.company_id].expires_at).getTime() > Date.now() && <button type="button" disabled={supportBusy} onClick={() => handleStartImpersonation(comp)} className="bg-emerald-700 text-white px-3 py-2 rounded-lg text-xs font-bold">Entrar no painel</button>}
                                {supportSessions[comp.company_id] && <button type="button" disabled={supportBusy} onClick={() => supportEnd(comp.company_id)} className="border border-red-700 text-red-300 px-3 py-2 rounded-lg text-xs">Encerrar sessão</button>}
                              </div>
                            </div>}
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {subAbaConfig === 'conta' && (
                  <div className="bg-[#161616] border border-[#262626] p-5 sm:p-8 rounded-2xl w-full">
                    <div className="flex flex-col lg:flex-row gap-6 sm:gap-10">
                      <div className="flex flex-col items-center shrink-0">
                        <div className="relative group mb-3">
                          <div className="w-24 h-24 sm:w-32 sm:h-32 rounded-full overflow-hidden bg-[#111111] border-2 border-[#D95B1E] shadow-xl flex items-center justify-center">
                            {currentUser?.avatar_url ? (
                              <img src={currentUser.avatar_url} alt="Perfil" className="w-full h-full object-cover" />
                            ) : (
                              <span className="text-4xl sm:text-5xl font-black text-[#D95B1E] uppercase">
                                {currentUser?.username ? currentUser.username.charAt(0) : '?'}
                              </span>
                            )}
                          </div>
                          <button onClick={() => avatarInputRef.current?.click()} className="absolute inset-0 bg-black/60 rounded-full flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity text-white text-[11px] font-semibold cursor-pointer">
                            Mudar Foto
                          </button>
                          <input type="file" accept="image/*" ref={avatarInputRef} onChange={handleAvatarUpload} className="hidden" />
                        </div>
                        <div className="flex items-center gap-3">
                          <button onClick={() => avatarInputRef.current?.click()} className="text-xs text-[#D95B1E] hover:text-[#c34e17] font-semibold">Alterar foto</button>
                          {currentUser?.avatar_url && <button onClick={handleRemoveAvatar} className="text-xs text-zinc-500 hover:text-red-400">Remover</button>}
                        </div>
                      </div>

                      <div className="flex-1 w-full border-t lg:border-t-0 lg:border-l border-[#262626] pt-5 lg:pt-0 lg:pl-10">
                        <h1 className="text-lg sm:text-2xl font-bold text-white mb-1 sm:mb-2">Informações da Sessão</h1>
                        <p className="text-[11px] sm:text-xs text-zinc-400 mb-5">Gestão das credenciais ativas do sistema.</p>
                        <div className="space-y-3 sm:space-y-5">
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div className="bg-[#1f1f1f] border border-[#2d2d2d] rounded-xl p-3.5">
                              <span className="text-[10px] uppercase font-bold text-zinc-500 block mb-0.5">Utilizador</span>
                              <span className="font-bold text-white text-sm sm:text-base">{currentUser?.username}</span>
                            </div>
                            <div className="bg-[#1f1f1f] border border-[#2d2d2d] rounded-xl p-3.5">
                              <span className="text-[10px] uppercase font-bold text-zinc-500 block mb-0.5">Função</span>
                              <span className="font-bold text-[#D95B1E] uppercase text-sm sm:text-base">{currentUser?.role}</span>
                            </div>
                          </div>
                          <div className="bg-[#1f1f1f] border border-[#2d2d2d] rounded-xl p-3.5">
                            <span className="text-[10px] uppercase font-bold text-zinc-500 block mb-0.5">Unidade Ativa</span>
                            <span className="font-bold text-white text-sm sm:text-lg block truncate">{effectiveCompanyName}</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* CURSOR MULTIPLAYER */}
          {isSupportSessionActive && (
            <LiveCursor 
              companyId={effectiveCompanyId}
              currentUsername={currentUser?.username}
              currentUserRole={currentUser?.role}
              targetUsername={'foodstrick-support'}
              isActive={isSupportSessionActive}
              supabaseClient={supabaseClient}
            />
          )}

          {/* CHAT DE SUPORTE */}
          {isSupportSessionActive && (
            <SupportChat 
              companyId={effectiveCompanyId}
              currentUsername={currentUser?.username}
              currentUserRole={currentUser?.role}
              operatorUsername={'foodstrick-support'}
              isVisible={isSupportSessionActive}
              supabaseClient={supabaseClient}
            />
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- PWA FOODSTRICK: registro isolado, sem alterar fluxos do sistema -->
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
          .catch(function (error) { console.warn('FoodStrick PWA: registro indisponível', error); });
      });
    }
  </script>
</body>
</html>
