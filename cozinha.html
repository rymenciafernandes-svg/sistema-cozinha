<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoodStrick | Cozinha</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#f5f5f5;font:14px system-ui,Arial}header{padding:20px;border-bottom:1px solid #333;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:23px}h2{font-size:18px}small,.muted{color:#aaa}main{padding:20px;max-width:1500px;margin:auto}.orange{color:#D95B1E}button{border:0;border-radius:9px;background:#D95B1E;color:#fff;font-weight:700;padding:11px 15px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.secondary{background:#292929;border:1px solid #444}input{display:block;width:100%;padding:12px;background:#202020;color:white;border:1px solid #444;border-radius:8px;margin:8px 0 15px}.login{max-width:380px;margin:8vh auto;background:#191919;border:1px solid #333;border-radius:16px;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:16px}.card{background:#191919;border:1px solid #353535;border-radius:14px;padding:17px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.pill{padding:5px 9px;border-radius:20px;background:#3a2a1b;color:#ffc48f;font-size:12px}.item{background:#222;border:1px solid #333;border-radius:10px;padding:12px;margin:12px 0}.note{color:#ffbf82}.remove{color:#ffc06b;font-weight:700}.check{display:flex;gap:8px;align-items:flex-start;margin:10px 0;color:#ddd}.check input{width:auto;margin:3px}.error{color:#ff9999;white-space:pre-wrap}.empty{padding:40px;text-align:center;color:#999;border:1px dashed #444;border-radius:14px}#app[hidden],#login[hidden]{display:none}
</style></head><body>
<section id="login" class="login"><h1>FoodStrick <span class="orange">KDS</span></h1><p class="muted">Acesso exclusivo da cozinha</p><form id="loginForm"><label>E-mail<input type="email" id="email" autocomplete="username" required></label><label>Senha<input type="password" id="password" autocomplete="current-password" required></label><button id="loginButton">Entrar na cozinha</button></form><p id="loginError" class="error" role="alert"></p></section>
<div id="app" hidden><header><div><h1>FoodStrick <span class="orange">| Cozinha</span></h1><small id="company"></small></div><div class="row"><span id="updated" class="muted"></span><button class="secondary" id="refresh">Atualizar</button><button class="secondary" id="logout">Sair</button></div></header><main><div class="row"><h2 id="summary">Pedidos em preparo</h2><small>Atualização automática a cada 5 segundos</small></div><p id="error" class="error" role="alert"></p><div id="orders" class="grid"></div></main></div>
<script>
const client=window.supabase.createClient('https://ddngvelrtqmfgaeqsjem.supabase.co','sb_publishable_EhLCuypZr6vHrSKDCrHxQg_n7BvKxBU',{auth:{storageKey:'foodstrick-kds-auth'}});
const $=id=>document.getElementById(id);let busy=false,previous='',userCompany=null;const checked=new Set();
function elem(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=String(text);return e}
async function init(){const {data}=await client.auth.getUser();if(!data.user){$('login').hidden=false;$('app').hidden=true;return}try{const r=await client.rpc('fs_kds_my_company');if(r.error)throw r.error;if(!r.data)throw Error('Sua conta não tem autorização para acessar a cozinha.');userCompany=r.data;$('company').textContent='Unidade: '+userCompany;$('login').hidden=true;$('app').hidden=false;await load()}catch(e){$('loginError').textContent=e.message;$('login').hidden=false;$('app').hidden=true}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';$('loginButton').disabled=true;try{const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await init()}catch(err){$('loginError').textContent=err.message}finally{$('loginButton').disabled=false}});
$('logout').onclick=async()=>{await client.auth.signOut();userCompany=null;checked.clear();$('password').value='';await init()};$('refresh').onclick=()=>load();
async function change(id,status){if(busy)return;busy=true;$('error').textContent='';try{const r=await client.rpc('fs_kds_change_status',{p_order_id:id,p_status:status});if(r.error)throw r.error;await load()}catch(e){$('error').textContent=e.message}finally{busy=false}}
function render(orders){const root=$('orders');root.replaceChildren();$('summary').textContent=`Na fila: ${orders.filter(x=>x.status==='accepted').length} · Preparando: ${orders.filter(x=>x.status==='preparing').length} · Prontos: ${orders.filter(x=>x.status==='ready').length}`;if(!orders.length){root.append(elem('div','empty','Nenhum pedido aguardando preparo.'));return}for(const o of orders){const card=elem('article','card');const heading=elem('div','row');heading.append(elem('strong','',`Pedido #${String(o.id).slice(0,8).toUpperCase()}`),elem('span','pill',o.status==='accepted'?'Na fila':o.status==='preparing'?'Em preparo':'Pronto'));card.append(heading,elem('p','muted',new Date(o.created_at).toLocaleString('pt-BR')));if(o.notes)card.append(elem('p','note','Observações: '+o.notes));for(const it of o.items||[]){const item=elem('section','item');item.append(elem('strong','',`${it.quantity} × ${it.product_name}`));for(const a of it.addons||[])item.append(elem('p','note',`+ ${a.quantity} × ${a.name}`));for(const r of it.removals||[])item.append(elem('p','remove','SEM '+String(r.name).toUpperCase()));if(it.steps?.length){item.append(elem('p','muted','Passo a passo da receita:'));it.steps.forEach((step,i)=>{const label=elem('label','check'),cb=document.createElement('input');cb.type='checkbox';const key=`${o.id}:${it.id}:${i}`;cb.checked=checked.has(key);cb.onchange=()=>cb.checked?checked.add(key):checked.delete(key);label.append(cb,elem('span','',`${i+1}. ${step}`));item.append(label)})}else item.append(elem('p','muted','Sem instruções cadastradas para este produto.'));card.append(item)}if(o.status!=='ready'){const btn=elem('button','',o.status==='accepted'?'Iniciar preparo':'Marcar pedido pronto');btn.onclick=()=>change(o.id,o.status==='accepted'?'preparing':'ready');card.append(btn)}root.append(card)}}
async function load(){if(!userCompany||busy)return;busy=true;try{const r=await client.rpc('fs_kds_orders');if(r.error)throw r.error;const orders=Array.isArray(r.data)?r.data:[];const serialized=JSON.stringify(orders);if(serialized!==previous){render(orders);previous=serialized}$('updated').textContent='Atualizado: '+new Date().toLocaleTimeString('pt-BR');$('error').textContent=''}catch(e){$('error').textContent='Falha ao sincronizar: '+e.message}finally{busy=false}}
setInterval(()=>{if(userCompany)load()},5000);init();
</script></body></html>
