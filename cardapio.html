  <script>
    const SUPABASE_URL = 'https://ddngvelrtqmfgaeqsjem.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_EhLCuypZr6vHrSKDCrHxQg_n7BvKxBU';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const pathMatch = location.pathname.match(/^\/loja\/([^/]+)\/?$/i);
    const slug = (pathMatch ? decodeURIComponent(pathMatch[1]) : null) || new URLSearchParams(location.search).get('menu_slug') || new URLSearchParams(location.search).get('slug') || (location.pathname.endsWith('/cardapio.html') ? null : location.pathname.split('/').filter(Boolean).pop());
    const app = document.getElementById('app');
    app.addEventListener('click', event => { const link = event.target.closest('a[data-menu-scroll]'); if (!link) return; const target = document.getElementById(link.getAttribute('href').slice(1)); if (!target) return; event.preventDefault(); target.scrollIntoView({behavior:'smooth',block:'start'}); });
    let menu = null, products = [], combos = [], cart = {}, comboCart = {}, pixSettings = null;
    let availableAddons = [], availableRemovables = [], availableMeatPoints = [], addonLines = [], addonModalProduct = null, addonDraft = {}, removableDraft = [], meatPointDraft = null;
     let cartDrawerOpen = false;
     let couponPreview = null;
    const money = v => Number(v || 0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function callRpc(name, payload={}) { const {data,error}=await sb.rpc(name,payload); if(error) throw error; return data; }
    const icon = (name) => {
      const paths = {
        delivery: '<rect x="1" y="5" width="14" height="12" rx="2"/><path d="M15 9h4l3 4v4h-7"/><circle cx="5" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>',
        pickup: '<path d="M4 9h16l-1 12H5L4 9Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/>',
        dining: '<path d="M4 3v7a3 3 0 0 0 6 0V3M7 3v18M17 3v18M17 3c-3 3-3 8 0 10h3V3"/>',
        cart: '<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 2h2l3 14h14l3-10H4"/>',
        image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>'
      };
      return `<svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0">${paths[name]||''}</svg>`;
    };

    // BR Code Pix estático (EMV). A criação do QR não confirma o recebimento.
    const pixField=(id,value)=>String(id).padStart(2,'0')+String(new TextEncoder().encode(value).length).padStart(2,'0')+value;
    function pixCRC(str){let crc=0xffff;for(const byte of new TextEncoder().encode(str)){crc ^= byte<<8;for(let i=0;i<8;i++)crc=(crc&0x8000)?((crc<<1)^0x1021)&0xffff:(crc<<1)&0xffff;}return crc.toString(16).toUpperCase().padStart(4,'0');}
    function pixText(s,max){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9 .-]/g,'').toUpperCase().trim().slice(0,max);}
    function makePix(key,name,city,amount){
      const merchant=pixField('00','br.gov.bcb.pix')+pixField('01',key);
      const code=pixField('00','01')+pixField('26',merchant)+pixField('52','0000')+pixField('53','986')+pixField('54',Number(amount).toFixed(2))+pixField('58','BR')+pixField('59',pixText(name,25))+pixField('60',pixText(city,15))+pixField('62',pixField('05','***'))+'6304';
      return code+pixCRC(code);
    }
    function showPixOrder(result){
       document.body.style.overflow='';cartDrawerOpen=false;
      const total=Number(result.total);

       app.querySelector('#couponCheck')?.addEventListener('click',async()=>{
         const feedback=app.querySelector('#couponFeedback'),code=app.querySelector('#couponCode')?.value.trim().toUpperCase();
         if(!code){couponPreview=null;window.savedCouponCode='';feedback.textContent='Informe o código.';return;}
         feedback.textContent='Consultando...';
         try{const result=await callRpc('fs_coupon_public_preview',{p_slug:slug,p_code:code,p_subtotal:total});
           if(result?.valid){couponPreview={code,discount:Number(result.discount)||0,subtotal:total};window.savedCouponCode=code;render();const msg=app.querySelector('#couponFeedback');if(msg)msg.textContent=`Cupom válido: ${money(couponPreview.discount)} de desconto estimado. O valor definitivo será confirmado pelo servidor.`;}else{couponPreview=null;window.savedCouponCode=code;feedback.textContent=result?.message||'Cupom indisponível.';}
         }catch(e){couponPreview=null;feedback.textContent=e.message||'Consulta indisponível.';}
       });
      app.querySelector('#couponCode')?.addEventListener('input',e=>{window.savedCouponCode=e.target.value;couponPreview=null;const msg=app.querySelector('#couponFeedback');if(msg)msg.textContent='Clique em Consultar para validar o código.';});
      const type=app.querySelector('#orderType'),address=app.querySelector('#address');
      const toggle=()=>{if(!type||!address)return;address.style.display=type.value==='delivery'?'block':'none';address.required=type.value==='delivery';};if(type)type.onchange=toggle;toggle();
      app.querySelector('#orderForm').onsubmit=async e=>{e.preventDefault();const feedback=app.querySelector('#feedback');const form=new FormData(e.currentTarget);const items=visibleProducts.filter(p=>Number(cart[p.id]||0)>0).map(p=>({product_id:p.id,quantity:Number(cart[p.id])}));const chosenCombos=selectedCombos.map(c=>({combo_id:c.id,quantity:Number(comboCart[c.id])}));if(!items.length&&!chosenCombos.length&&!addonLines.length){feedback.textContent='Adicione pelo menos um item.';return;}const btn=e.currentTarget.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Enviando...';try{const couponCode=couponPreview && Math.abs(Number(couponPreview.subtotal)-total)<0.005 && (app.querySelector('#couponCode')?.value||'').trim().toUpperCase()===couponPreview.code ? couponPreview.code : '';if((app.querySelector('#couponCode')?.value||'').trim()&&!couponCode)throw new Error('Consulte novamente o cupom antes de enviar o pedido.');const result=await callRpc(couponCode?'fs_coupon_create_order':(addonLines.length?'foodstrick_create_order_with_addons':(chosenCombos.length?'foodstrick_create_order_with_combos':'foodstrick_create_order')),{...(couponCode?{p_coupon_code:couponCode,p_combos:chosenCombos,p_addons:addonLines.map(l=>({product_id:l.product_id,addons:l.addons.map(a=>({id:a.id,quantity:a.quantity})),removed_ingredients:(l.removed_ingredients||[]).map(r=>({id:r.id})),meat_point:l.meat_point||null}))}:{}),...(addonLines.length?{p_addons:addonLines.map(l=>({product_id:l.product_id,addons:l.addons.map(a=>({id:a.id,quantity:a.quantity})),removed_ingredients:(l.removed_ingredients||[]).map(r=>({id:r.id})),meat_point:l.meat_point||null})),p_combos:chosenCombos}:(chosenCombos.length?{p_combos:chosenCombos}:{})),p_slug:slug,p_customer_name:form.get('customer_name'),p_customer_phone:form.get('customer_phone'),p_order_type:form.get('order_type'),p_delivery_address:form.get('delivery_address'),p_payment_method:form.get('payment_method')==='Pix por chave'?'Pix':form.get('payment_method'),p_notes:[String(form.get('notes')||'').trim(),...addonLines.flatMap((l,i)=>(l.removed_ingredients||[]).length?[`PERSONALIZAÇÃO ${i+1} — ${products.find(p=>p.id===l.product_id)?.name||products.find(p=>p.id===l.product_id)?.nome||'Produto'}: SEM ${(l.removed_ingredients||[]).map(r=>r.name).join(', ')}`]:[]),...addonLines.flatMap((l,i)=>l.meat_point?[`PONTO DA CARNE ${i+1} — ${products.find(p=>p.id===l.product_id)?.name||products.find(p=>p.id===l.product_id)?.nome||'Produto'}: ${l.meat_point}`]:[])].filter(Boolean).join(' | ').slice(0,500),p_items:items});window.savedOrderFields=null;document.body.style.overflow='';cartDrawerOpen=false;if(form.get('payment_method')==='Pix InfinitePay'){const {data:checkout,error:checkoutError}=await sb.functions.invoke('foodstrick-infinitepay',{body:{action:'create',order_id:result.order_id,checkout_token:result.checkout_token}});if(checkoutError||!checkout?.url)throw new Error(checkout?.error||checkoutError?.message||'Não foi possível abrir o checkout. O pedido foi criado; contate o restaurante antes de tentar novamente.');location.assign(checkout.url);return;}if(form.get('payment_method')==='Pix por chave'){showPixOrder(result);return;}app.innerHTML=`<div class="min-h-[70vh] flex flex-col items-center justify-center text-center"><div class="accent rounded-full w-16 h-16 flex items-center justify-center text-3xl mb-5">✓</div><h1 class="text-2xl font-black">Pedido enviado!</h1><p class="text-zinc-400 mt-2">Número do pedido: <strong class="text-white">${esc(result.order_id)}</strong></p><p class="mt-3">Total: <strong>${money(result.total)}</strong></p><p class="text-sm text-zinc-500 mt-5">O estabelecimento precisa confirmar seu pedido.</p><button id="newOrder" class="accent rounded-xl px-6 py-3 mt-6 font-bold">Fazer outro pedido</button></div>`;app.querySelector('#newOrder').onclick=()=>{cart={};comboCart={};addonLines=[];render();};}catch(err){feedback.textContent=err.message||'Não foi possível enviar o pedido.';btn.disabled=false;btn.textContent='Tentar novamente';}};
    }
    async function checkInfinitepayReturn(){const q=new URLSearchParams(location.search);const orderId=q.get('order_nsu'),transaction=q.get('transaction_nsu'),invoice=q.get('slug');if(!orderId||!transaction||!invoice)return false;app.innerHTML='<div class="max-w-lg mx-auto py-16 text-center space-y-4"><h1 class="text-2xl font-bold">Verificando pagamento...</h1><p class="text-zinc-400">Aguarde a confirmação oficial da InfinitePay.</p></div>';try{const {data,error}=await sb.functions.invoke('foodstrick-infinitepay',{body:{action:'check',order_id:orderId,transaction_nsu:transaction,slug:invoice}});if(error)throw error;app.innerHTML=`<div class="max-w-lg mx-auto py-16 text-center space-y-4"><h1 class="text-2xl font-bold">${data?.paid?'Pagamento confirmado!':'Pagamento ainda não confirmado'}</h1><p class="text-zinc-300">Pedido ${esc(orderId)}</p><p class="text-zinc-400">${data?.paid?'O restaurante recebeu a confirmação automática.':'O restaurante poderá acompanhar o status. Não pague novamente sem conferir.'}</p><a class="inline-block accent px-6 py-3 rounded-xl font-bold" href="${esc((pathMatch ? location.pathname : '/cardapio.html?menu_slug='+encodeURIComponent(slug)))}">Voltar ao cardápio</a></div>`;}catch(e){app.innerHTML=`<div class="max-w-lg mx-auto py-16 text-center space-y-4"><h1 class="text-xl font-bold">Verificação pendente</h1><p class="text-zinc-400">Não foi possível consultar a InfinitePay agora. Não repita o pagamento. O restaurante poderá conferir o recebimento.</p></div>`;}return true;}
    (async()=>{if(await checkInfinitepayReturn())return;})();
    (async()=>{try{if(new URLSearchParams(location.search).has('transaction_nsu'))return;if(!slug)throw new Error('Link de cardápio inválido.');const result=await callRpc('foodstrick_public_menu',{p_slug:slug});menu=result.menu;products=result.products||[];try{pixSettings=await callRpc('foodstrick_public_pix_settings',{p_slug:slug});}catch(e){console.warn('Pix não configurado:',e.message);pixSettings=null;}if(!products.length){products=[];}try{const publicCombos=await callRpc('foodstrick_public_combos',{p_slug:slug});combos=Array.isArray(publicCombos)?publicCombos:[];}catch(comboError){console.warn('Combos indisponíveis:',comboError.message);combos=[];}try{const result=await callRpc('foodstrick_public_addons',{p_slug:slug});availableAddons=Array.isArray(result)?result:[]}catch(addonError){console.warn('Adicionais indisponíveis:',addonError.message);availableAddons=[];}try{const list=await callRpc('foodstrick_public_removable_ingredients',{p_slug:slug});availableRemovables=Array.isArray(list)?list:[]}catch(ingredientError){console.warn('Ingredientes removíveis indisponíveis:',ingredientError.message);availableRemovables=[];}try{const points=await callRpc('foodstrick_public_meat_points',{p_slug:slug});availableMeatPoints=Array.isArray(points)?points:[]}catch(meatError){console.warn('Pontos da carne indisponíveis:',meatError.message);availableMeatPoints=[];}render();}catch(e){app.innerHTML=`<div class="py-20 text-center"><h1 class="text-2xl font-bold">Cardápio indisponível</h1><p class="text-zinc-400 mt-2">${esc(e.message||'Tente novamente mais tarde.')}</p></div>`;}})();
